[pilot]
standard_games = 500
exploratory_games = 200
output_root = "artifacts/pilot"
canonical_standard_description = "500 canonical standard games using frozen base seeds"
exploratory_description = "200 exploratory games paired with Standard Games 1 through 200"

[split]
base_seed_count = 500
discovery_count = 300
validation_count = 200
seed_source = "configs/policy_seeds.json generated by phase7-policy-config-v1"

[policy]
matrix_path = "configs/policies.json"
finalist_count = 3
finalist_advancement_rule = "Advance the top three candidate policies by discovery table-win access through Turn 8, breaking ties by earlier win turn, then protected win count, then lower policy_config_id; validation seeds never affect advancement."

[audit]
random_standard_games = 50
random_exploratory_games = 25
all_turn_3_or_4_wins = true
all_unfamiliar_or_nonstandard_lines = true
minimum_mulligans_to_four = 10
minimum_one_piece_short_games = 10
minimum_protection_delay_games = 10
supplemental_audit_only_excluded_from_percentages = true

[shards]
standard_shards = 10
standard_games_per_shard = 50
exploratory_shards = 4
exploratory_games_per_shard = 50
assignment = "contiguous canonical game indexes; exploratory games paired to standard games 1-200"

[exploratory]
maximum_nodes_per_game = 5000
expected_maximum_total_nodes = 1000000
