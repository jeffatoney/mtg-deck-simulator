name: Interaction Freeze Bootstrap

on:
  pull_request:
    paths:
      - "automation/interaction-coverage-lock.json"
      - "automation/interaction-choice-contracts.json"
      - "automation/interaction-record.schema.json"
      - "scripts/build_interaction_coverage_manifest.py"
      - "src/mtg_cards/full_deck.py"
      - "src/mtg_cards/oracle.py"
      - "src/mtg_deck/**"
      - "docs/source/oracle/snapshot_v1.json"
      - "docs/source/decklist.txt"
      - "docs/source/commanders.txt"
      - "docs/source/MagicCompRules_2026-06-19.txt"
      - ".github/workflows/interaction-freeze-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Build interaction surface
        run: python scripts/build_interaction_coverage_manifest.py --output interaction-surface.json
      - name: Populate placeholder lock once
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          zero_hash = "sha256:" + ("0" * 64)
          lock_path = Path("automation/interaction-coverage-lock.json")
          surface_path = Path("interaction-surface.json")
          lock = json.loads(lock_path.read_text(encoding="utf-8"))
          surface = json.loads(surface_path.read_text(encoding="utf-8"))

          if lock.get("manifest_sha256") != zero_hash:
              print("Lock is already frozen; bootstrap will not rewrite it.")
              raise SystemExit(0)

          lock.update(
              {
                  "card_definition_count": surface["card_definition_count"],
                  "physical_card_count": surface["physical_card_count"],
                  "card_composition_record_count": surface["card_composition_record_count"],
                  "card_effect_record_count": surface["card_effect_record_count"],
                  "global_rule_record_count": surface["global_rule_record_count"],
                  "record_count": surface["record_count"],
                  "manifest_sha256": surface["manifest_sha256"],
                  "note": (
                      "Coordinator surface frozen from the deterministic manifest. "
                      "This bootstrap may populate only an all-zero placeholder; "
                      "later surface changes require an explicit specification revision."
                  ),
              }
          )
          lock_path.write_text(
              json.dumps(lock, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(lock, indent=2, sort_keys=True))
          PY
      - name: Commit frozen lock
        run: |
          if git diff --quiet -- automation/interaction-coverage-lock.json; then
            echo "No placeholder lock change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/interaction-coverage-lock.json
          git commit -m "Freeze interaction coverage surface"
          git push origin "HEAD:${{ github.head_ref }}"
