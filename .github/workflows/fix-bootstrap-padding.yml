name: Execute verified Phase C study-binding transform

on:
  push:
    branches:
      - phase-c/study-definition-binding

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Execute verified Phase C transform payload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Reconstruct and verify transform
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          parts = [
              ('.tmp/phase_c_transform.part1', 3333, 'aa06aaa243dba34c4ed6056dbab292343e30a8aeb4f9456cfd9509c86a95f9ea'),
              ('.tmp/phase_c_transform.part2', 3333, 'ac5dbf51d3e129496f0be442202b6e833a65bbcac8a08c7db0a8bec678186b54'),
              ('.tmp/phase_c_transform.part3', 3333, 'e0d6405c6dced4bf6c7fc42707ee907db68e22ce1fdef78d79e336795f2115fc'),
              ('.tmp/phase_c_transform.part4', 3333, 'ce70fe1e49215ea4b83fc45b6bea50e080f0d23e9cfe88ccec3bc6d6e764b39c'),
          ]
          chunks = []
          for name, expected_len, expected_sha in parts:
              text = Path(name).read_text(encoding='utf-8')
              actual_sha = hashlib.sha256(text.encode()).hexdigest()
              if len(text) != expected_len or actual_sha != expected_sha:
                  raise SystemExit(f'{name}: len={len(text)} sha256={actual_sha}')
              chunks.append(text)
          payload = ''.join(chunks)
          if len(payload) != 13332:
              raise SystemExit(f'payload length mismatch: {len(payload)}')
          script = gzip.decompress(base64.b64decode(payload, validate=True))
          original_digest = hashlib.sha256(script).hexdigest()
          if original_digest != '5781a0a00a21fb58c324496daef3a8f180bad2dc17b9de9b8aedb7a5fd991034':
              raise SystemExit(f'original transform SHA-256 mismatch: {original_digest}')
          text = script.decode('utf-8')
          class_needle = '        class PhaseCConfiguration:\n'
          if text.count(class_needle) != 2:
              raise SystemExit(f'PhaseCConfiguration transform target count={text.count(class_needle)}')
          text = text.replace(class_needle, '        @dataclass(frozen=True)\n        class PhaseCConfiguration:\n')
          old_line = '    old_clean = dedent(old)\n'
          new_line = '    new_clean = dedent(new)\n'
          if text.count(old_line) != 1 or text.count(new_line) != 1:
              raise SystemExit('replace_once normalization targets changed')
          text = text.replace(old_line, '    old_clean = dedent(old).strip("\\n")\n')
          text = text.replace(new_line, '    new_clean = dedent(new).strip("\\n")\n')
          newline_needle = 'json.dumps(payload) + "\\n"'
          if text.count(newline_needle) != 2:
              raise SystemExit(f'diagnostic newline transform target count={text.count(newline_needle)}')
          text = text.replace(newline_needle, 'json.dumps(payload) + "\\\\n"')
          script = text.encode('utf-8')
          patched_digest = hashlib.sha256(script).hexdigest()
          if patched_digest != 'b4443c1a801abfdf695bddf8f593dd129809d98f7e6b1ce2a43d24fdc14f6bd4':
              raise SystemExit(f'patched transform SHA-256 mismatch: {patched_digest}')
          out = Path('/tmp/bootstrap_phase_c_study_binding.py')
          out.write_bytes(script)
          print(f'verified transform bytes={len(script)} sha256={patched_digest}')
          PY
          python /tmp/bootstrap_phase_c_study_binding.py
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Format and lint
        run: |
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff format .
          uv run ruff check .
      - name: Strict typing
        run: uv run mypy src
      - name: Focused Phase C tests
        run: |
          uv run pytest -q \
            tests/phase_c/test_phase_c_study_binding.py \
            tests/phase_c/test_phase_c_governance_binding.py \
            tests/phase_c/test_phase_c_diagnostic.py \
            tests/phase_c/test_phase_c_diagnostic_provenance.py \
            tests/phase_c/test_phase_c_artifacts.py \
            tests/phase_c/test_phase_c_control.py \
            tests/phase_c/test_phase_c_timing.py
      - name: Diff integrity
        run: git diff --check
      - name: Commit substantive correction only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/phase-c-diagnostic.yml \
            src/mtg_runs/phase_c.py \
            src/mtg_runs/phase_c_pairing.py \
            src/mtg_runs/phase_c_artifacts.py \
            src/mtg_runs/phase_c_timing.py \
            src/mtg_runs/phase_c_diagnostic.py \
            scripts/_phase_b_paths.py \
            docs/audit/handoff/PROTOCOL.md \
            tests/phase_c/test_phase_c_study_binding.py \
            tests/phase_c/test_phase_c_governance_binding.py \
            tests/phase_c/test_phase_c_diagnostic.py \
            tests/phase_c/test_phase_c_diagnostic_provenance.py
          git diff --cached --check
          git commit -m "Bind Phase C study definitions and governance"
          git push origin HEAD:phase-c/study-definition-binding
