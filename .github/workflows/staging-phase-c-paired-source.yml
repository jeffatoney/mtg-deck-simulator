name: TEMP Phase C paired source snapshot

on:
  pull_request:
    branches: [phase-c/pilot-authorization]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package exact source tree
        run: |
          git archive --format=tar.gz --output="${RUNNER_TEMP}/phase-c-paired-source.tar.gz" HEAD
          git rev-parse HEAD > "${RUNNER_TEMP}/HEAD.txt"
          git rev-parse HEAD^{tree} > "${RUNNER_TEMP}/TREE.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: phase-c-paired-source-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/phase-c-paired-source.tar.gz
            ${{ runner.temp }}/HEAD.txt
            ${{ runner.temp }}/TREE.txt
          if-no-files-found: error
          retention-days: 1
