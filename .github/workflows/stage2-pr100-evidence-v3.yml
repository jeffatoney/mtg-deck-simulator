','single_candidate_fresh_process':'PASS','four_trace_fresh_replay':True},'repair_scope':'Generally correct for battlefield activated discard costs represented by existing generic cost["discard"] schema; exact-deck proof covers Glint-Horn. No universality claim for other non-mana cost types.','executor_changed':False,'seed_391_terminal_regression':{'command':'uv run pytest -q tests/phase_c/test_phase_c_terminal_cleanup.py -vv','passed':False,'exit_code':1,'resulting_terminal_status':analysis['runs']['repaired-391730338978874520']['terminal_status'],'frozen_expectation':'TERMINAL','test_expectation_modified':False,'broker_repair_alone_restored_frozen_terminal_expectation':False},'attempt_semantics':{'implementation_changed':False,'owner_decision_required':True,'status':'EXISTING_DEFINITION_REPORTED_ONLY'},'access_witness':{'combo_access_changed':False,'finite_witness_certified_by_stage2':False,'status':'ACCESS_WITNESS_VALIDATION_REQUIRED'},'validation_source_workflow_run_id':int(os.environ['PRIOR_VALIDATION_RUN_ID']),'validation_pre_evidence':validation,'remaining_blockers':blockers,'owner_decision_required':True,'corrected_pilot_authorized':False,'replacement_pilot_authorized':False,'full_study_authorized':False,'historical_artifacts_modified':False,'pr100_certified':False,'pr100_ready_for_review':False,'pr100_merged':False,'pr99_modified_or_integrated':False}
          jp=root/'docs/audit/phase-c-postpilot/PHASE_C_GLINT_HORN_COST_CHOICE_REPAIR.json'; jp.write_text(json.dumps(stage2,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          def line(key):
