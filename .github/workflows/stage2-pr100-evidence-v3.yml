jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IDENTITY_MODEL_SHA256: ${{ vars.IDENTITY_MODEL_V2_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REPAIR_SHA }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --frozen --all-extras

      - name: Verify exact repair state and recover exact historical diagnostic
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REPAIR_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$REPAIR_TREE"
          test "$(git rev-parse HEAD^)" = "$START_SHA"
          old_zip=docs/audit/phase-c-postpilot/evidence/pr100-corrected-behavior-971f5567.zip
          test "$(sha256sum "$old_zip" | cut -d' ' -f1)" = "7e314f859d1e774b232f1d3daeed146441553e8f31c9aa0615a428d37a8aad8a"
          git show "$HIST_DIAG_SHA:.github/diagnostics/pr100_public_tiebreak_diagnostic.py.txt" > "${RUNNER_TEMP}/pr100_diag.py"
          python - <<'PY'
          from pathlib import Path
          import os
          path=Path(os.environ['RUNNER_TEMP'])/'pr100_diag.py'
          text=path.read_text(encoding='utf-8')
          old='''            "combo_earliest_legal_turn": dict(
                          execution.technical_game.combo_earliest_legal_turn
                      ),
          '''
          new='''            "combo_earliest_legal_turn": dict(
                          execution.technical_game.combo_earliest_legal_turn
                      ),
                      "combo_checkpoint_access": {
                          str(package): {str(turn): bool(value) for turn, value in checkpoints.items()}
                          for package, checkpoints in execution.technical_game.combo_checkpoint_access.items()
                      },
          '''
          if text.count(old) != 1:
              raise SystemExit('checkpoint summary anchor mismatch')
          path.write_text(text.replace(old,new),encoding='utf-8')
          PY

      - name: Reproduce the four deterministic repaired-head traces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/stage2-traces"
          for selector in legacy repaired; do
            for seed in 101 391730338978874520; do
              uv run python "${RUNNER_TEMP}/pr100_diag.py" \
                --repo . --seed "$seed" --selector "$selector" \
                --commit "$REPAIR_SHA" --tree "$REPAIR_TREE" --fresh \
                --out "${RUNNER_TEMP}/stage2-traces/${selector}-${seed}.json"
            done
          done
          test "$(find "${RUNNER_TEMP}/stage2-traces" -maxdepth 1 -name '*.json' | wc -l)" -eq 4

      - name: Recompute and verify trace identity against the first nondurable run
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from __future__ import annotations
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'stage2-traces'
          expected={
            'legacy-101.json':'5dc7311cab76a3bcd58c19542173965042046b8903177949d256a5a5de199108',
            'legacy-391730338978874520.json':'2835e668e60b94f9e4d9cd8ab1bf5d201838ab44c54ab3d3cec85e116cd01167',
            'repaired-101.json':'721d86249de6918a58161e4fcb65d1407f5e6c22dbd88fbb25664b90bd93930f',
            'repaired-391730338978874520.json':'0276d308ed13f6f43783f0058cd841773cb18f639420b0de272b8d5842d0a9ea',
          }
          glint='Glint-Horn Buccaneer'; ability='glint-horn:loot'
          data={}
          members=[]
