name: PR100 Stage2 Repaired Evidence V3

on:
  push:
    branches: [automation/pr100-stage2-evidence-v3-20260817]

permissions:
  contents: write

env:
  REPAIR_SHA: 4d15c18592a8df1a6ba23df034c3b68701088315
  REPAIR_TREE: f1ac2c11f1b0e989e13d3e7d72480779cfb7f4c8
  START_SHA: cbfbcd437a91f0c4481cba2173a8a6e8cd6553e8
  START_TREE: 683243839e72a4c676cdd37310afc919775e762d
  HIST_DIAG_SHA: 971f5567f47eb6f753a96a5809f72b5e9e23a404
