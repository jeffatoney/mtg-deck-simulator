              out=v['summary']['outcome']
              return {'decision_count':len(ds),'total_candidate_count':sum(int(r['total_legal_action_count']) for r in ds),'distinct_public_key_tie_count':sum(r['tie_classification']=='DISTINCT_PUBLIC_KEYS' for r in ds),'selector_preference_disagreement_count':sum(bool(r['historical_and_repaired_selections_differ']) for r in ds),'first_selector_preference_disagreement_index':next((int(r['decision_index']) for r in ds if r['historical_and_repaired_selections_differ']),None),'glint_horn_candidate_count':len(gc),'glint_horn_activate_candidate_count':len(ga),'selected_glint_horn_cast_count':len(sc),'selected_attacker_declarations_containing_glint_horn':len(sa),'selected_glint_horn_loot_activation_count':len(sl),'attacking_turns':sorted({int(r['turn_number']) for r in sa}),'actual_first_attempt_turn':out['actual_first_attempt_turn'],'attempt_package':out['attempt_package'],'combo_earliest_legal_turn':out['combo_earliest_legal_turn'],'combo_checkpoint_access':out.get('combo_checkpoint_access',{}),'terminal_status':out['terminal_status'],'controlled_turns_completed':out['controlled_turns_completed'],'command_count':out['command_count'],'final_state_hash':out['final_state_hash'],'fresh_replay_state_hash':out['fresh_replay_state_hash'],'fresh_replay_equal':out['fresh_replay_equal'],'member_sha256':raw_sha,'member_size_bytes':size}
          runs={}
