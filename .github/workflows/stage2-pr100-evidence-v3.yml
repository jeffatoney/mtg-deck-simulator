              return f"| {key} | {r['decision_count']} | {r['distinct_public_key_tie_count']} | {r['selector_preference_disagreement_count']} | {r['glint_horn_candidate_count']} | {r['glint_horn_activate_candidate_count']} | {r['selected_glint_horn_loot_activation_count']} | {r['attacking_turns']} | {r['actual_first_attempt_turn']} / {r['attempt_package']} | {cp} | {r['terminal_status']} / {r['controlled_turns_completed']} |"
