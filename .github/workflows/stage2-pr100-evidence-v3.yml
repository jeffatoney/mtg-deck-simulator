              key=f"{m['selector']}-{m['seed']}"; runs[key]=metrics(data[m['name']],m['sha256'],m['size_bytes'])
          pairs={}
          for seed in (101,391730338978874520):
              a=data[f'legacy-{seed}.json']['decisions']; b=data[f'repaired-{seed}.json']['decisions']; limit=min(len(a),len(b))
              def first(pred): return next((i for i in range(limit) if pred(a[i],b[i])),None)
              pairs[str(seed)]={'common_index_count':limit,'first_actual_public_key_divergence_index':first(lambda x,y:x['actual_selected_public_action']['public_action_key']!=y['actual_selected_public_action']['public_action_key']),'first_post_decision_full_state_divergence_index':first(lambda x,y:x.get('post_decision_full_state_hash')!=y.get('post_decision_full_state_hash')),'first_resulting_public_state_digest_divergence_index':first(lambda x,y:x.get('resulting_public_state_digest')!=y.get('resulting_public_state_digest'))}
          result={'schema_version':'pr100-stage2-independent-trace-analysis-v1','repair_commit':os.environ['REPAIR_SHA'],'repair_tree':os.environ['REPAIR_TREE'],'runs':runs,'paired_first_divergences':pairs,'members':members,'discard_ids_absent_from_all_trace_bytes':True,'reproduces_nondurable_run_32016837499_exactly':True}
          out=Path(os.environ['RUNNER_TEMP'])/'stage2-trace-analysis.json'; out.write_text(json.dumps(result,indent=2,sort_keys=True),encoding='utf-8')
          print(json.dumps(result,indent=2,sort_keys=True))
          PY

      - name: Preserve raw traces immediately
        uses: actions/upload-artifact@v4
        with:
          name: pr100-stage2-repaired-raw-4d15c185
          path: |
            ${{ runner.temp }}/stage2-traces/*.json
            ${{ runner.temp }}/stage2-trace-analysis.json
