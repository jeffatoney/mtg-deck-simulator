          python -m py_compile "${RUNNER_TEMP}/pr100_tiebreak_observer.py"
      - name: Run exact frozen-seed diagnostic
        id: diagnostic
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run python "${RUNNER_TEMP}/pr100_tiebreak_observer.py" \
            --repo "${GITHUB_WORKSPACE}" \
            --commit "${{ matrix.commit }}" \
            --tree "${{ matrix.tree }}" \
            --implementation "${{ matrix.implementation }}" \
            --seed "${{ matrix.seed }}" \
            --through-turn 10 \
            --fresh-replay \
            --output "${RUNNER_TEMP}/pr100-${{ matrix.implementation }}-${{ matrix.seed }}.json" \
            2>&1 | tee "${RUNNER_TEMP}/pr100-${{ matrix.implementation }}-${{ matrix.seed }}.log"
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr100-behavior-${{ matrix.implementation }}-${{ matrix.seed }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pr100-${{ matrix.implementation }}-${{ matrix.seed }}.json
            ${{ runner.temp }}/pr100-${{ matrix.implementation }}-${{ matrix.seed }}.log
          if-no-files-found: error
          retention-days: 3
      - name: Enforce diagnostic
        if: steps.diagnostic.outcome == 'failure'
        run: exit 1
