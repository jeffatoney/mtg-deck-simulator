name: PR 100 isolated counterfactual diagnostic

on:
  push:
    branches:
      - hardening/public-policy-noninterference

permissions:
  contents: read

jobs:
  counterfactual:
    name: ${{ matrix.mode }} seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: legacy_all
            seed: "101"
          - mode: legacy_all
            seed: "391730338978874520"
          - mode: seed101_u_only
            seed: "101"
          - mode: seed101_u_and_fading_malcolm
            seed: "101"
          - mode: seed391_opt_only
            seed: "391730338978874520"
          - mode: seed391_treasure_g_r
            seed: "391730338978874520"
    env:
      IDENTITY_MODEL_SHA256: ${{ vars.IDENTITY_MODEL_V2_SHA256 }}
    steps:
