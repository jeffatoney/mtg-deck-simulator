          TREE="$(git rev-parse HEAD^{tree})"
          mkdir -p "${RUNNER_TEMP}/pr100-behavior"
          for selector in repaired legacy; do
            for seed in 101 391730338978874520; do
              uv run python "${RUNNER_TEMP}/pr100_public_tiebreak_diagnostic.py" \
                --repo . \
                --seed "${seed}" \
                --selector "${selector}" \
                --commit "${COMMIT}" \
                --tree "${TREE}" \
                --fresh \
                --out "${RUNNER_TEMP}/pr100-behavior/${selector}-${seed}.json"
            done
