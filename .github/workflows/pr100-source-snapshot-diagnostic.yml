        with:
          fetch-depth: 1
          ref: b1c6e8f8bf8532c28f8f0e1eee6a9cc980884d72
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
