name: PR 100 exact behavioral diagnostic

on:
  push:
    branches:
      - hardening/public-policy-noninterference

permissions:
  contents: read

jobs:
  observe:
    name: ${{ matrix.implementation }} seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - implementation: historical
            commit: "150671a8e7a78e5fa14b6b3aca2308f6af647df3"
            tree: "37cf737691d516a0b7316270364724f91dd28856"
            seed: "101"
          - implementation: repaired
            commit: "b1c6e8f8bf8532c28f8f0e1eee6a9cc980884d72"
            tree: "d9f1fd61042c67ed0cf4990fca3018f59dd1c4e5"
            seed: "101"
          - implementation: historical
            commit: "150671a8e7a78e5fa14b6b3aca2308f6af647df3"
            tree: "37cf737691d516a0b7316270364724f91dd28856"
            seed: "391730338978874520"
          - implementation: repaired
            commit: "b1c6e8f8bf8532c28f8f0e1eee6a9cc980884d72"
            tree: "d9f1fd61042c67ed0cf4990fca3018f59dd1c4e5"
            seed: "391730338978874520"
    env:
      IDENTITY_MODEL_SHA256: ${{ vars.IDENTITY_MODEL_V2_SHA256 }}
