name: PR101 Promote Final Evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pr101-promote-final-evidence.yml"

permissions:
  contents: write
  actions: read

jobs:
  promote:
    if: github.head_ref == 'hardening/shared-resource-accounting'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/shared-resource-accounting
          fetch-depth: 0

      - name: Verify promotion ancestry
        run: |
          git merge-base --is-ancestor 511e0587a750f7b8b20059c0230c055160d2c135 HEAD
          test "$(git diff --name-only 511e0587a750f7b8b20059c0230c055160d2c135 HEAD)" = ".github/workflows/pr101-promote-final-evidence.yml"

      - name: Download exact CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr101/a" "$RUNNER_TEMP/pr101/b" "$RUNNER_TEMP/pr101/bench"
          gh api /repos/${{ github.repository }}/actions/artifacts/9463682231/zip > "$RUNNER_TEMP/pr101/a.zip"
          gh api /repos/${{ github.repository }}/actions/artifacts/9463681314/zip > "$RUNNER_TEMP/pr101/b.zip"
          gh api /repos/${{ github.repository }}/actions/artifacts/9461374876/zip > "$RUNNER_TEMP/pr101/bench.zip"
          unzip -q "$RUNNER_TEMP/pr101/a.zip" -d "$RUNNER_TEMP/pr101/a"
          unzip -q "$RUNNER_TEMP/pr101/b.zip" -d "$RUNNER_TEMP/pr101/b"
          unzip -q "$RUNNER_TEMP/pr101/bench.zip" -d "$RUNNER_TEMP/pr101/bench"

      - name: Verify exact payloads and provenance
        run: |
          echo "91ea467ddf747a279dd823b6576f8dfe554f184cbb6576ae85177ecb99844d59  $RUNNER_TEMP/pr101/a/CERTIFICATION.json" | sha256sum -c -
          echo "7237a44a54865a1b5a52e581e425ba3f767eea1671285fae98afdca335751d40  $RUNNER_TEMP/pr101/b/CERTIFICATION.json" | sha256sum -c -
          echo "fcc6a6303a20a46537ec0b5e9f581a7ecad7b1a183eacc14a99507032698db24  $RUNNER_TEMP/pr101/bench/result.json" | sha256sum -c -
          python - <<'PY'
          import json, os
          root = os.environ['RUNNER_TEMP'] + '/pr101'
          a = json.load(open(root + '/a/CERTIFICATION.json'))
          b = json.load(open(root + '/b/CERTIFICATION.json'))
          bench = json.load(open(root + '/bench/result.json'))
          expected = '511e0587a750f7b8b20059c0230c055160d2c135'
          tree = 'b68b06b47e67b2bd70cc4719479fb527525c3d8b'
          run_id = '32521764886'
          assert a['status'] == 'PASS' and a['certified_content_commit'] == expected
          assert b['status'] == 'PASS' and b['certified_content_commit'] == expected
          assert a['certified_repository_tree_sha'] == tree
          assert b['certified_repository_tree_sha'] == tree
          assert a['github_run_id'] == run_id and b['github_run_id'] == run_id
          assert a['counts']['fail'] == 0 and a['counts']['pass'] == 33
          assert b['counts']['fail'] == 0 and b['counts']['pass'] == 239
          assert b['transcript_count'] == 12 and b['unsupported_capabilities'] == []
          assert bench['subject_sha'] == expected
          assert bench['trial_count'] == 16
          assert bench['worker_errors'] == []
          assert bench['strategic_context_instantiated'] is False
          assert bench['pilot_or_full_study_executed'] is False
          PY

      - name: Promote exact artifacts unchanged
        run: |
          cp "$RUNNER_TEMP/pr101/a/CERTIFICATION.json" docs/audit/phase-a-certification/CERTIFICATION.json
          cp "$RUNNER_TEMP/pr101/b/CERTIFICATION.json" docs/audit/phase-b-certification/CERTIFICATION.json
          cp "$RUNNER_TEMP/pr101/bench/result.json" docs/audit/stage2-bridge-standard/RESULT.json
          echo "91ea467ddf747a279dd823b6576f8dfe554f184cbb6576ae85177ecb99844d59  docs/audit/phase-a-certification/CERTIFICATION.json" | sha256sum -c -
          echo "7237a44a54865a1b5a52e581e425ba3f767eea1671285fae98afdca335751d40  docs/audit/phase-b-certification/CERTIFICATION.json" | sha256sum -c -
          echo "fcc6a6303a20a46537ec0b5e9f581a7ecad7b1a183eacc14a99507032698db24  docs/audit/stage2-bridge-standard/RESULT.json" | sha256sum -c -
          git config user.name "jeffatoney"
          git config user.email "jeff.a.toney@gmail.com"
          git rm .github/workflows/pr101-promote-final-evidence.yml
          git add -- docs/audit/phase-a-certification/CERTIFICATION.json docs/audit/phase-b-certification/CERTIFICATION.json docs/audit/stage2-bridge-standard/RESULT.json
          git commit -m "chore: promote final Stage 2 evidence"
          git push origin HEAD:hardening/shared-resource-accounting
