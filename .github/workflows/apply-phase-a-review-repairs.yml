name: Apply reviewed Phase A repairs

on:
  push:
    branches:
      - engine/phase-a-rules-kernel
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      IDENTITY_MODEL_SHA256: ${{ vars.IDENTITY_MODEL_V2_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engine/phase-a-rules-kernel
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Reconstruct and apply reviewed patch
        run: |
          base64 -d .phase-a-review-repairs.b64 | gzip -dc > /tmp/phase-a-review-repairs.patch
          test "$(sha256sum /tmp/phase-a-review-repairs.patch | cut -d' ' -f1)" = "41ee39ef728a702d913019e44d1fe45874773b9b6b5770e458a0bd9f8ef3793a"
          git apply --check /tmp/phase-a-review-repairs.patch
          git apply /tmp/phase-a-review-repairs.patch
          rm .phase-a-review-repairs.b64
          rm .github/workflows/apply-phase-a-review-repairs.yml
      - name: Validate reviewed repair set
        run: |
          uv sync --frozen --all-extras
          uv run ruff format .
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src
          uv run pytest -q -ra
          uv run python scripts/check_identity_lock.py
          uv run python scripts/check_phase_a_authority.py
          uv run python scripts/check_clean_engine_boundary.py
          uv run mtg-sources validate-sources
          git add -A
          uv run python scripts/check_manifest.py
      - name: Commit reviewed repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close Phase A independent-review findings"
          git push origin HEAD:engine/phase-a-rules-kernel
