name: Apply reviewed Phase A repairs

on:
  push:
    branches:
      - engine/phase-a-rules-kernel
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      IDENTITY_MODEL_SHA256: ${{ vars.IDENTITY_MODEL_V2_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engine/phase-a-rules-kernel
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Reconstruct and apply reviewed patch
        run: |
          base64 -d .phase-a-review-repairs.b64 | gzip -dc > /tmp/phase-a-review-repairs.patch
          test "$(sha256sum /tmp/phase-a-review-repairs.patch | cut -d' ' -f1)" = "41ee39ef728a702d913019e44d1fe45874773b9b6b5770e458a0bd9f8ef3793a"
          git apply --check /tmp/phase-a-review-repairs.patch
          git apply /tmp/phase-a-review-repairs.patch
          python - <<'PY'
          from pathlib import Path
          path = Path("src/mtg_kernel/engine.py")
          text = path.read_text(encoding="utf-8")
          old = '''                    selected = bool(choices["commander_to_command"])
                    choice_event = self._event(
                        "COMMANDER_LIBRARY_REPLACEMENT_CHOICE", action
                    )
                    choice = Choice(
                        self.identity.new_id("choice"),
                        instance.owner_id,
                        "COMMANDER_LIBRARY_REPLACEMENT",
                        "COMMAND" if selected else "LIBRARY",
                        choice_event.event_id,
                    )
                    self.state.choices.append(choice)
                    commander_choice_id = choice.choice_id
                    if selected:
                        destination = Zone.COMMAND
          '''
          new = '''                    commander_to_command = bool(choices["commander_to_command"])
                    choice_event = self._event(
                        "COMMANDER_LIBRARY_REPLACEMENT_CHOICE", action
                    )
                    choice = Choice(
                        self.identity.new_id("choice"),
                        instance.owner_id,
                        "COMMANDER_LIBRARY_REPLACEMENT",
                        "COMMAND" if commander_to_command else "LIBRARY",
                        choice_event.event_id,
                    )
                    self.state.choices.append(choice)
                    commander_choice_id = choice.choice_id
                    if commander_to_command:
                        destination = Zone.COMMAND
          '''
          if old not in text:
              raise SystemExit("Commit commander-choice block not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          rm .phase-a-review-repairs.b64
          rm .github/workflows/apply-phase-a-review-repairs.yml
      - name: Validate reviewed repair set
        run: |
          uv sync --frozen --all-extras
          uv run ruff format .
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src
          uv run pytest -q -ra
          uv run python scripts/check_identity_lock.py
          uv run python scripts/check_phase_a_authority.py
          uv run python scripts/check_clean_engine_boundary.py
          uv run mtg-sources validate-sources
          git add -A
          uv run python scripts/check_manifest.py
      - name: Commit reviewed repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close Phase A independent-review findings"
          git push origin HEAD:engine/phase-a-rules-kernel
