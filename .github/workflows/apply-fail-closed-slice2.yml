name: Apply Fail-Closed Slice 2 Repair

on:
  push:
    branches:
      - engine/phase-b-full-deck-policy
    paths:
      - .github/workflows/apply-fail-closed-slice2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Reconstruct exact locally tested files
        run: |
          cat automation/fail-closed-slice2.part1 automation/fail-closed-slice2.part2 \
            | base64 --decode > /tmp/fail-closed-slice2.tar.xz
          test "$(sha256sum /tmp/fail-closed-slice2.tar.xz | cut -d' ' -f1)" = \
            "9e11b07d56e3c06742679eef2cccc563000824547750ce5c78099c13c591bfb7"
          xz --decompress --stdout /tmp/fail-closed-slice2.tar.xz | tar --extract --directory .
      - name: Verify exact source blobs
        run: |
          python -m py_compile \
            src/mtg_kernel/phase_b_actions.py \
            src/mtg_policy/broker.py \
            tests/phase_b/test_broker_fail_closed.py
          test "$(git hash-object src/mtg_kernel/phase_b_actions.py)" = \
            "24fc7ff8660dca2b827b421a5b7ffe33437883dc"
          test "$(git hash-object src/mtg_policy/broker.py)" = \
            "e74c13029e5cf02d10e277ec84c2226e766ff1b3"
          test "$(git hash-object tests/phase_b/test_broker_fail_closed.py)" = \
            "86e1d0584e688b1727b45a844045cdec04f85aca"
          git diff --check
      - name: Commit ordinary source and test files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/mtg_kernel/phase_b_actions.py \
            src/mtg_policy/broker.py \
            tests/phase_b/test_broker_fail_closed.py
          git commit -m "Make the policy broker fail closed on unverified execution"
          git push origin HEAD:${{ github.ref_name }}
