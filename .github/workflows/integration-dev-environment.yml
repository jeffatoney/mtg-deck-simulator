name: Integration Dev Environment

on:
  pull_request:
    paths:
      - ".github/workflows/integration-dev-environment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Build locked environment
        run: uv sync --frozen --all-extras
      - name: Package environment
        run: tar -czf integration-dev-environment.tar.gz .venv
      - name: Upload environment
        uses: actions/upload-artifact@v4
        with:
          name: integration-dev-environment-${{ github.sha }}
          path: integration-dev-environment.tar.gz
          if-no-files-found: error
          retention-days: 1
