name: Phase A closeout formatter

on:
  push:
    branches:
      - governance/phase-a-certification-closeout

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/phase-a-certification-closeout
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --frozen --all-extras
      - name: Format and validate closeout files
        run: |
          uv run ruff format \
            scripts/check_clean_engine_boundary.py \
            scripts/check_phase_a_certification.py \
            scripts/record_phase_a_certification.py \
            tests/test_certification_gate.py
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src
          rm .github/workflows/phase-a-closeout-format.yml
      - name: Commit formatted closeout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format Phase A certification closeout"
          git push origin HEAD:governance/phase-a-certification-closeout
