name: Phase A Workbench

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workbench:
    if: github.head_ref == 'engine/phase-a-rules-kernel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --frozen --all-extras
      - name: Format rewritten files
        run: uv run ruff format src scripts tests automation
      - name: Lint formatted tree
        run: uv run ruff check src scripts tests
      - name: Type check formatted tree
        run: uv run mypy src
      - name: Tests on formatted tree
        run: uv run pytest -q -ra
      - name: Package formatted sources
        if: always()
        run: |
          tar -czf /tmp/phase-a-formatted.tar.gz src scripts tests automation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-a-formatted-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/phase-a-formatted.tar.gz
          retention-days: 7
