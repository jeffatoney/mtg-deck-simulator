name: Phase A Setup Autoformat

"on":
  push:
    branches:
      - recovery/phase-a-setup

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/phase-a-setup
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Sync frozen dependencies
        run: uv sync --frozen --all-extras
      - name: Apply Ruff formatting
        run: uv run ruff format scripts/check_architecture_invariants.py tests/test_architecture_invariant_gate.py
      - name: Commit formatting changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_architecture_invariants.py tests/test_architecture_invariant_gate.py
          git commit -m "Apply Ruff formatting to strict Phase A gate"
          git push origin HEAD:recovery/phase-a-setup
