name: PR 100 corrected public tie-break behavioral evidence

on:
  push:
    branches:
      - hardening/public-policy-noninterference

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        selector: [repaired, legacy]
        seed: [101, 391730338978874520]
    env:
      IDENTITY_MODEL_SHA256: ${{ vars.IDENTITY_MODEL_V2_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --frozen --all-extras
      - name: Run corrected exact-head diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pr100-behavior"
          COMMIT="$(git rev-parse HEAD)"
          TREE="$(git rev-parse HEAD^{tree})"
          uv run python .github/diagnostics/pr100_public_tiebreak_diagnostic.py.txt \
            --repo . \
            --seed '${{ matrix.seed }}' \
            --selector '${{ matrix.selector }}' \
            --commit "${COMMIT}" \
            --tree "${TREE}" \
            --fresh \
            --out "${RUNNER_TEMP}/pr100-behavior/${{ matrix.selector }}-${{ matrix.seed }}.json"
      - name: Upload corrected behavioral evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr100-corrected-${{ matrix.selector }}-${{ matrix.seed }}-${{ github.sha }}
          path: ${{ runner.temp }}/pr100-behavior/*.json
          if-no-files-found: error
          retention-days: 7
