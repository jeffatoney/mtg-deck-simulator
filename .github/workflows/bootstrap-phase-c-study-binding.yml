name: Bootstrap Phase C study binding

on:
  push:
    branches:
      - phase-c/study-definition-binding

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message == 'Bootstrap Phase C study-binding edits' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Materialize and apply focused Phase C corrections
        run: |
          cat > "${RUNNER_TEMP}/bootstrap.py.gz.b64" <<'PAYLOAD'

PAYLOAD
          base64 --decode "${RUNNER_TEMP}/bootstrap.py.gz.b64" | gzip --decompress > "${RUNNER_TEMP}/bootstrap.py"
          python "${RUNNER_TEMP}/bootstrap.py"
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Format and lint fixes
        run: |
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff format .
          uv run ruff check .
      - name: Strict typing
        run: uv run mypy src
      - name: Focused Phase C tests
        run: |
          uv run pytest -q \
            tests/phase_c/test_phase_c_study_binding.py \
            tests/phase_c/test_phase_c_governance_binding.py \
            tests/phase_c/test_phase_c_diagnostic.py \
            tests/phase_c/test_phase_c_diagnostic_provenance.py \
            tests/phase_c/test_phase_c_artifacts.py \
            tests/phase_c/test_phase_c_control.py \
            tests/phase_c/test_phase_c_timing.py
      - name: Diff integrity
        run: git diff --check
      - name: Commit focused correction and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bootstrap-phase-c-study-binding.yml
          git add \
            .github/workflows/phase-c-diagnostic.yml \
            src/mtg_runs/phase_c.py \
            src/mtg_runs/phase_c_pairing.py \
            src/mtg_runs/phase_c_artifacts.py \
            src/mtg_runs/phase_c_timing.py \
            src/mtg_runs/phase_c_diagnostic.py \
            scripts/_phase_b_paths.py \
            docs/audit/handoff/PROTOCOL.md \
            tests/phase_c/test_phase_c_study_binding.py \
            tests/phase_c/test_phase_c_governance_binding.py \
            tests/phase_c/test_phase_c_diagnostic.py \
            tests/phase_c/test_phase_c_diagnostic_provenance.py
          git diff --cached --check
          git commit -m "Bind Phase C study definitions and governance"
          git push origin HEAD:phase-c/study-definition-binding
