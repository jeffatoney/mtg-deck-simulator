name: PR29 Pre-policy Gates

on:
  push:
    branches:
      - codex/capture-pytest-failures-and-classify-issues

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/capture-pytest-failures-and-classify-issues
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Validate sources
        run: uv run mtg-sim validate-sources
      - name: Validate static coverage
        run: uv run mtg-sim validate-coverage
      - name: Validate executable coverage
        run: uv run mtg-sim validate-executable-coverage
      - name: Validate pre-policy readiness
        run: uv run mtg-sim validate-prepolicy-readiness
      - name: Commit refreshed coverage artifact
        run: |
          if git diff --quiet -- artifacts/coverage/full-executable-coverage.json; then
            echo "Coverage artifact is current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/coverage/full-executable-coverage.json
          git commit -m "Refresh executable coverage evidence"
          git push origin HEAD:codex/capture-pytest-failures-and-classify-issues
