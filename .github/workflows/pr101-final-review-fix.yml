name: PR101 Final Review Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pr101-final-review-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'hardening/shared-resource-accounting'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/shared-resource-accounting
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Apply runner profile plumbing and verify focused regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          runner = Path("src/mtg_runs/phase_c_runner.py")
          text = runner.read_text()
          old_signature = '''    policy_config_id: str = "anchor_balanced",\n    through_turn: int = 10,\n'''
          new_signature = '''    policy_config_id: str = "anchor_balanced",\n    opponent_mana_profile: str = "blue_red_available",\n    through_turn: int = 10,\n'''
          if new_signature not in text:
              if old_signature not in text:
                  raise SystemExit("phase_c_runner signature anchor missing")
              text = text.replace(old_signature, new_signature, 1)
          old_bind = '''    tracker = bind_combo_access_tracker(\n        executor, CONTROLLED_PLAYER, evaluator_config.combo_packages\n    )\n'''
          new_bind = '''    tracker = bind_combo_access_tracker(\n        executor,\n        CONTROLLED_PLAYER,\n        evaluator_config.combo_packages,\n        opponent_mana_profile=opponent_mana_profile,\n    )\n'''
          if new_bind not in text:
              if old_bind not in text:
                  raise SystemExit("phase_c_runner bind anchor missing")
              text = text.replace(old_bind, new_bind, 1)
          runner.write_text(text)
          PY

          uv run ruff format src/mtg_kernel/resource_sources.py src/mtg_policy/broker.py src/mtg_runs/phase_c_runner.py tests/phase_b/test_stage2_resource_broker_profile_alignment.py
          uv run ruff check src/mtg_kernel/resource_sources.py src/mtg_policy/broker.py src/mtg_runs/phase_c_runner.py tests/phase_b/test_stage2_resource_broker_profile_alignment.py
          uv run pytest -q tests/phase_b/test_stage2_resource_broker_profile_alignment.py
          uv run pytest -q tests/phase_b/test_resource_state_integration.py tests/phase_b/test_glint_horn_action_surface.py

      - name: Commit verified production fix
        run: |
          git config user.name "jeffatoney"
          git config user.email "jeff.a.toney@gmail.com"
          git rm .github/workflows/pr101-final-review-fix.yml
          git add -- src/mtg_kernel/resource_sources.py src/mtg_policy/broker.py src/mtg_runs/phase_c_runner.py tests/phase_b/test_stage2_resource_broker_profile_alignment.py
          git commit -m "fix: align production broker resource profiles"
          git push origin HEAD:hardening/shared-resource-accounting
