name: PR 100 temporary commander-choice repair v3

on:
  push:
    branches:
      - hardening/public-policy-noninterference

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IDENTITY_MODEL_SHA256: ${{ vars.IDENTITY_MODEL_V2_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: hardening/public-policy-noninterference
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --frozen --all-extras
      - name: Apply and verify the general Rule 903.9a repair
        shell: bash
        run: |
          set -euo pipefail
          expected() {
            test "$(git hash-object "$1")" = "$2"
          }
          if expected src/mtg_kernel/engine_core.py 9866d65b8b13fe7be686a32dce23f4077eaa4cfd \
            && expected src/mtg_kernel/zones.py eb9c8c4d2b29568c71ad3d8e7cf346b4d32c1769 \
            && expected tests/phase_a/test_kernel_acceptance.py 3a05f998f7ad1305ba83e0af2f6511225c892ce5 \
            && expected tests/phase_b/test_broker_fail_closed.py 37c85b13aa6fb1a71cfed124a12d71ea70cfb699; then
            echo "Commander-choice repair is already present."
            exit 0
          fi
          uv run python scripts/pr100_apply_commander_choice_fix.py --repo .
          uv run ruff format \
            src/mtg_kernel/engine_core.py \
            src/mtg_kernel/zones.py \
            tests/phase_a/test_kernel_acceptance.py \
            tests/phase_b/test_broker_fail_closed.py
          expected src/mtg_kernel/engine_core.py 9866d65b8b13fe7be686a32dce23f4077eaa4cfd
          expected src/mtg_kernel/zones.py eb9c8c4d2b29568c71ad3d8e7cf346b4d32c1769
          expected tests/phase_a/test_kernel_acceptance.py 3a05f998f7ad1305ba83e0af2f6511225c892ce5
          expected tests/phase_b/test_broker_fail_closed.py 37c85b13aa6fb1a71cfed124a12d71ea70cfb699
          uv run pytest -q \
            tests/phase_a/test_kernel_acceptance.py::test_commander_optional_return_and_commander_damage_terminal \
            tests/phase_b/test_broker_fail_closed.py::test_pending_commander_return_choice_suppresses_priority_actions
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/mtg_kernel/engine_core.py \
            src/mtg_kernel/zones.py \
            tests/phase_a/test_kernel_acceptance.py \
            tests/phase_b/test_broker_fail_closed.py
          git commit -m 'fix: offer commander graveyard or exile choice once per move'
          git push origin HEAD:hardening/public-policy-noninterference
