# One-time transparent source corrections for the final Codex P1 review.
name: Apply Phase A final review fixes

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - name: Apply terminal and owner-anchor corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f'missing transformation target: {label}')

          engine = Path('src/mtg_kernel/engine.py')
          text = engine.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '''    def put_waiting_triggers_on_stack(self) -> None:\n        if self._resolution_depth:\n            return\n''',
              '''    def put_waiting_triggers_on_stack(self) -> None:\n        if self.state.terminal.status != "ACTIVE" or self._resolution_depth:\n            return\n''',
              'terminal trigger guard',
          )
          engine.write_text(text, encoding='utf-8')

          acceptance = Path('tests/phase_a/test_kernel_acceptance.py')
          text = acceptance.read_text(encoding='utf-8')
          terminal_test = '''\n\ndef test_terminal_damage_does_not_put_waiting_triggers_on_stack() -> None:\n    state, executor = funded_game()\n    malcolm = add_card(\n        executor,\n        specs_by_name()["Malcolm, Keen-Eyed Navigator"],\n        Zone.BATTLEFIELD,\n    )\n    state.players["P1"].life = 1\n\n    executor.deal_damage_to_player(malcolm.object_id, "P1", 1, combat=True)\n\n    assert state.terminal.status == "TERMINAL"\n    assert not state.stack\n    assert state.events[-1].kind == "GAME_TERMINATED"\n    terminal_index = next(\n        index for index, event in enumerate(state.events) if event.kind == "GAME_TERMINATED"\n    )\n    assert not any(\n        event.kind == "TRIGGER_PUT_ON_STACK" for event in state.events[terminal_index + 1 :]\n    )\n'''
          if 'def test_terminal_damage_does_not_put_waiting_triggers_on_stack()' not in text:
              text += terminal_test
          acceptance.write_text(text, encoding='utf-8')

          checker = Path('scripts/check_phase_a_golden_transcripts.py')
          text = checker.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '''APPROVAL_SCHEMA = "phase-a-golden-transcript-approvals-v1"\nREQUIRED_COUNT = 5\n''',
              '''APPROVAL_SCHEMA = "phase-a-golden-transcript-approvals-v1"\nREQUIRED_COUNT = 5\nEXPECTED_OWNER_NAME = "Jeff Toney"\nEXPECTED_APPROVAL_DOCUMENT_SHA256 = (\n    "d78be11d330df0bccbee4439556da6ae000683d4ccacce83d90ad8ed5de8174b"\n)\n''',
              'owner anchor constants',
          )
          text = replace_once(
              text,
              '''    collected_nodes: set[str] | None = None,\n    root: Path = ROOT,\n) -> dict[str, Any]:\n''',
              '''    collected_nodes: set[str] | None = None,\n    root: Path = ROOT,\n    expected_approval_document_sha256: str = EXPECTED_APPROVAL_DOCUMENT_SHA256,\n    expected_owner_name: str = EXPECTED_OWNER_NAME,\n) -> dict[str, Any]:\n''',
              'owner anchor parameters',
          )
          text = replace_once(
              text,
              '''    approval_document = json.loads(approvals_path.read_text(encoding="utf-8"))\n    if approval_document.get("schema_version") != APPROVAL_SCHEMA:\n''',
              '''    approval_document = json.loads(approvals_path.read_text(encoding="utf-8"))\n    approval_document_sha256 = hashlib.sha256(canonical_bytes(approval_document)).hexdigest()\n    if approval_document_sha256 != expected_approval_document_sha256:\n        raise ValueError("golden transcript approval record is not owner-anchored")\n    if approval_document.get("schema_version") != APPROVAL_SCHEMA:\n''',
              'approval document digest check',
          )
          text = replace_once(
              text,
              '''        if not approved_by or not _iso_timestamp(approved_at):\n            raise ValueError(f"owner approval identity or timestamp is invalid: {transcript_id}")\n''',
              '''        if approved_by != expected_owner_name or not _iso_timestamp(approved_at):\n            raise ValueError(f"owner approval identity or timestamp is invalid: {transcript_id}")\n''',
              'exact owner identity check',
          )
          text = replace_once(
              text,
              '''        "count": len(validated),\n        "transcripts": validated,\n''',
              '''        "count": len(validated),\n        "owner_approval_anchor": {\n            "approved_by": expected_owner_name,\n            "approval_document_sha256": approval_document_sha256,\n        },\n        "transcripts": validated,\n''',
              'validation result owner anchor',
          )
          checker.write_text(text, encoding='utf-8')

          gate_tests = Path('tests/test_golden_transcript_gate.py')
          text = gate_tests.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '''import json\nimport shutil\n''',
              '''import hashlib\nimport json\nimport shutil\n''',
              'hashlib test import',
          )
          text = replace_once(
              text,
              '''from check_phase_a_golden_transcripts import (  # noqa: E402\n    validate_golden_transcripts,\n)\n''',
              '''from check_phase_a_golden_transcripts import (  # noqa: E402\n    canonical_bytes,\n    validate_golden_transcripts,\n)\n''',
              'canonical bytes test import',
          )
          old_helper = '''def _sandbox(tmp_path: Path, *, approve: bool) -> tuple[Path, Path, set[str]]:\n    root = tmp_path / "repo"\n    destination = root / "docs/audit/phase-a-golden-transcripts"\n    shutil.copytree(SOURCE_DIR, destination)\n    approvals_path = destination / "APPROVALS.json"\n    approvals = json.loads(approvals_path.read_text(encoding="utf-8"))\n    nodes: set[str] = set()\n    for entry in approvals["approvals"]:\n        transcript = json.loads((root / entry["path"]).read_text(encoding="utf-8"))\n        nodes.add(transcript["machine"]["test_node"])\n        entry["status"] = "PENDING_OWNER_APPROVAL"\n        entry["approved_by"] = None\n        entry["approved_at"] = None\n        entry["approval_statement"] = None\n        if approve:\n            entry["status"] = "APPROVED"\n            entry["approved_by"] = "Phase A test approver"\n            entry["approved_at"] = "2026-07-31T05:00:00-07:00"\n            entry["approval_statement"] = (\n                f"I approve {entry['transcript_id']} at exact SHA-256 {entry['sha256']} "\n                "as a Phase A golden transcript."\n            )\n    approvals_path.write_text(\n        json.dumps(approvals, indent=2, sort_keys=True) + "\\n", encoding="utf-8"\n    )\n    return root, approvals_path, nodes\n'''
          new_helper = '''def _approval_digest(path: Path) -> str:\n    document = json.loads(path.read_text(encoding="utf-8"))\n    return hashlib.sha256(canonical_bytes(document)).hexdigest()\n\n\ndef _sandbox(tmp_path: Path, *, approve: bool) -> tuple[Path, Path, set[str]]:\n    root = tmp_path / "repo"\n    destination = root / "docs/audit/phase-a-golden-transcripts"\n    shutil.copytree(SOURCE_DIR, destination)\n    approvals_path = destination / "APPROVALS.json"\n    approvals = json.loads(approvals_path.read_text(encoding="utf-8"))\n    nodes: set[str] = set()\n    for entry in approvals["approvals"]:\n        transcript = json.loads((root / entry["path"]).read_text(encoding="utf-8"))\n        nodes.add(transcript["machine"]["test_node"])\n        if not approve:\n            entry["status"] = "PENDING_OWNER_APPROVAL"\n            entry["approved_by"] = None\n            entry["approved_at"] = None\n            entry["approval_statement"] = None\n    if not approve:\n        approvals_path.write_text(\n            json.dumps(approvals, indent=2, sort_keys=True) + "\\n", encoding="utf-8"\n        )\n    return root, approvals_path, nodes\n'''
          text = replace_once(text, old_helper, new_helper, 'owner-anchored test sandbox')
          pending_old = '''            collected_nodes=nodes,\n            root=root,\n        )\n\n\ndef test_unbound_approval_statement_fails_closed'''
          pending_new = '''            collected_nodes=nodes,\n            root=root,\n            expected_approval_document_sha256=_approval_digest(approvals),\n        )\n\n\ndef test_unbound_approval_statement_fails_closed'''
          text = replace_once(text, pending_old, pending_new, 'pending approval digest override')
          unbound_old = '''            collected_nodes=nodes,\n            root=root,\n        )\n\n\ndef test_transcript_change_after_approval_is_rejected'''
          unbound_new = '''            collected_nodes=nodes,\n            root=root,\n            expected_approval_document_sha256=_approval_digest(approvals_path),\n        )\n\n\ndef test_forged_owner_identity_fails_closed(tmp_path: Path) -> None:\n    root, approvals_path, nodes = _sandbox(tmp_path, approve=True)\n    approvals = json.loads(approvals_path.read_text(encoding="utf-8"))\n    approvals["approvals"][0]["approved_by"] = "Phase A test approver"\n    approvals_path.write_text(\n        json.dumps(approvals, indent=2, sort_keys=True) + "\\n", encoding="utf-8"\n    )\n    with pytest.raises(ValueError, match="owner approval identity"):\n        validate_golden_transcripts(\n            root / "docs/audit/phase-a-golden-transcripts/transcripts",\n            approvals_path,\n            collected_nodes=nodes,\n            root=root,\n            expected_approval_document_sha256=_approval_digest(approvals_path),\n        )\n\n\ndef test_transcript_change_after_approval_is_rejected'''
          text = replace_once(text, unbound_old, unbound_new, 'forged owner test insertion')
          gate_tests.write_text(text, encoding='utf-8')

          Path('.github/workflows/apply-phase-a-final-review-fixes.yml').unlink()
          PY
      - name: Validate final review corrections
        run: |
          uv sync --frozen --all-extras
          uv run ruff format src/mtg_kernel/engine.py scripts/check_phase_a_golden_transcripts.py tests/phase_a/test_kernel_acceptance.py tests/test_golden_transcript_gate.py
          uv run ruff check src/mtg_kernel/engine.py scripts/check_phase_a_golden_transcripts.py tests/phase_a/test_kernel_acceptance.py tests/test_golden_transcript_gate.py
          uv run python scripts/check_phase_a_golden_transcripts.py
          uv run pytest -q tests/phase_a tests/test_golden_transcript_gate.py
      - name: Commit ordinary source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Close final Phase A review findings"
          git push origin HEAD:agent/phase-a-post-merge-corrections
