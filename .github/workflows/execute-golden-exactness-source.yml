# One-time executor for the already-reviewed golden-transcript transformation.
name: Execute golden transcript exactness source

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - name: Execute the reviewed source transformation with the contract correction
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-golden-transcript-exactness.yml')
          text = workflow.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY", start)
          script = text[start:end]
          script = script.replace(
              '    assert all(token.was_cast is False for token in tokens)\\n',
              '',
              1,
          )
          script = script.replace(
              "          Path('.github/workflows/apply-golden-transcript-exactness.yml').unlink()\n",
              '',
              1,
          )
          exec(compile(script, str(workflow), 'exec'))
          PY
      - name: Validate all approved transcript scenarios
        run: |
          uv sync --frozen --all-extras
          uv run ruff format src/mtg_kernel/engine.py tests/phase_a/test_kernel_acceptance.py
          uv run ruff check src/mtg_kernel/engine.py tests/phase_a/test_kernel_acceptance.py
          uv run pytest -q \
            tests/phase_a/test_kernel_acceptance.py::test_stack_resolution_requires_completed_priority_pass_transition \
            tests/phase_a/test_kernel_acceptance.py::test_lethal_damage_defers_state_based_actions_until_resolution_finishes \
            tests/phase_a/test_kernel_acceptance.py::test_commit_clears_pending_action_for_removed_spell_copy \
            tests/phase_a/test_kernel_acceptance.py::test_dualcaster_copy_and_twinflame_delayed_exile_are_real_objects
          uv run python scripts/check_phase_a_golden_transcripts.py
      - name: Commit ordinary source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/mtg_kernel/engine.py tests/phase_a/test_kernel_acceptance.py
          git diff --cached --check
          git commit -m "Execute all approved Phase A transcripts exactly"
          git push origin HEAD:agent/phase-a-post-merge-corrections
