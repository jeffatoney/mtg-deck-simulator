name: Phase C paired redesign validator

on:
  pull_request:
    branches:
      - phase-c/pilot-authorization

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: github.head_ref == 'staging/phase-c-paired-source'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve transformer and reset to exact reviewed parent
        run: |
          cp automation/apply_phase_c_pairing.py "$RUNNER_TEMP/apply_phase_c_pairing.py"
          python - <<'PY'
          from pathlib import Path
          path = Path("${{ runner.temp }}/apply_phase_c_pairing.py")
          text = path.read_text()
          old = '''    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f"{path}: expected one replacement, found {count}: {old[:80]!r}")\n    target.write_text(text.replace(old, new), encoding="utf-8")\n'''
          new = '''    count = text.count(old)\n    if count < 1:\n        raise SystemExit(f"{path}: replacement target not found: {old[:80]!r}")\n    target.write_text(text.replace(old, new, 1), encoding="utf-8")\n'''
          if old not in text:
              raise SystemExit("temporary replace_once helper patch not found")
          path.write_text(text.replace(old, new, 1))
          PY
          git checkout --detach bc849eadbb9f9f3dbad74d060f31d751ca770977
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Apply paired redesign
        run: python "$RUNNER_TEMP/apply_phase_c_pairing.py"
      - name: Normalize generated source and runtime choice support
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config_path = Path("docs/spec/phase-c/PHASE_C_PILOT_CONFIG.json")
          config = json.loads(config_path.read_text())
          # Preserve the already-frozen 500-game standard environment stream.
          # Exploratory now reuses 200 of these exact environments; only search
          # randomness receives a new domain.
          config["pilot"]["environment_seed_namespace"] = "phase-c-pilot-standard-v1"
          config_path.write_text(json.dumps(config, indent=2, ensure_ascii=False) + "\n")

          simple = {
              "src/mtg_runs/phase_c_pairing.py": [
                  ("from dataclasses import asdict, dataclass", "from dataclasses import dataclass"),
                  ("    return p_value\n\n\ndef _paired_bootstrap_percentile_ci", "    return float(p_value)\n\n\ndef _paired_bootstrap_percentile_ci"),
              ],
              "tests/phase_c/test_phase_c_artifacts.py": [
                  ("from dataclasses import asdict, replace", "from dataclasses import asdict"),
              ],
          }
          for filename, replacements in simple.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in replacements:
                  if text.count(old) != 1:
                      raise SystemExit(f"unexpected generated source shape: {filename}: {old[:60]!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text)

          path = Path("src/mtg_runs/phase_c_runner.py")
          text = path.read_text()
          seed_old = '    seed_text = f"phase-c:environment:{seed}"\n'
          seed_new = '    seed_text = f"phase-c:standard:{seed}"\n'
          if text.count(seed_old) != 1:
              raise SystemExit("unexpected generated environment seed construction")
          text = text.replace(seed_old, seed_new, 1)
          old = '''    explorer = (\n        _OneLayerExplorer(policy_config_id, int(effective_search_seed))\n        if mode == "EXPLORATORY" and policy_actions\n        else None\n    )\n'''
          new = '''    explorer = None\n    if mode == "EXPLORATORY" and policy_actions:\n        if effective_search_seed is None:\n            raise ValueError("EXPLORATORY execution requires a search seed")\n        explorer = _OneLayerExplorer(policy_config_id, effective_search_seed)\n'''
          if text.count(old) != 1:
              raise SystemExit("unexpected generated explorer construction")
          path.write_text(text.replace(old, new, 1))

          # Issue #78: public remainder cards from LOOK_SELECT_REST_BOTTOM must be
          # ordered deterministically. Lower evaluator value is bottommost first;
          # higher value remains closer to the top of the library.
          path = Path("src/mtg_policy/choices.py")
          text = path.read_text()
          marker = '''        elif request.purpose.startswith("TUTOR_"):\n'''
          block = '''        elif request.purpose == "ORDER_LIBRARY_BOTTOM":\n            if request.minimum != request.maximum or request.minimum != len(request.candidates):\n                raise UnsupportedCapability(\n                    "ORDER_LIBRARY_BOTTOM requires an exact ordering of every public candidate"\n                )\n            ordered = sorted(\n                request.candidates,\n                key=lambda card: (\n                    evaluations[card.handle],\n                    card.identity,\n                    card.handle,\n                ),\n            )\n            selected = tuple(card.handle for card in ordered)\n        elif request.purpose.startswith("TUTOR_"):\n'''
          if text.count(marker) != 1:
              raise SystemExit("unexpected strategic choice provider shape")
          path.write_text(text.replace(marker, block, 1))

          test_path = Path("tests/phase_c/test_phase_c_control.py")
          test_text = test_path.read_text()
          import_old = "from mtg_kernel.errors import IllegalAction\n"
          import_new = "from mtg_kernel.errors import IllegalAction, UnsupportedCapability\n"
          if test_text.count(import_old) != 1:
              raise SystemExit("unexpected Phase C error import shape")
          test_text = test_text.replace(import_old, import_new, 1)
          test_text += '''\n\ndef test_order_library_bottom_is_exact_deterministic_and_evaluator_bound() -> None:\n    bundle = next(\n        item for item in load_policy_matrix() if item.policy_config_id == "anchor_balanced"\n    )\n    evaluator = ContextualEvaluator(load_evaluator_config())\n    provider = PolicyStrategicChoiceProvider(bundle, evaluator)\n    cards = (\n        PublicCard("bottom-a", "Island", 0, ("Land",), ()),\n        PublicCard("bottom-b", "Twinflame", 2, ("Sorcery",), ()),\n        PublicCard("bottom-c", "Opt", 1, ("Instant",), ()),\n    )\n    request = CardSelectionRequest(\n        request_id="order-library-bottom",\n        actor_id="P0",\n        ability_id="impulse",\n        purpose="ORDER_LIBRARY_BOTTOM",\n        turn_number=3,\n        observation={"generation": 1, "player": "P0", "objects": [], "turn": {"number": 3}},\n        candidates=cards,\n        minimum=3,\n        maximum=3,\n    )\n    evaluations = {\n        card.handle: evaluator.evaluate_pile((card,), request.observation).score for card in cards\n    }\n    expected = tuple(\n        card.handle\n        for card in sorted(\n            cards,\n            key=lambda card: (evaluations[card.handle], card.identity, card.handle),\n        )\n    )\n    first = provider.choose_cards(request)\n    second = provider.choose_cards(request)\n    assert first == second\n    assert first.selected_handles == expected\n    assert set(first.selected_handles) == {card.handle for card in cards}\n    assert first.evaluator_id == evaluator.config.evaluator_id\n    assert first.evaluator_sha256 == evaluator.config.config_sha256\n    assert first.diagnostics["purpose"] == "ORDER_LIBRARY_BOTTOM"\n    with pytest.raises(UnsupportedCapability, match="exact ordering"):\n        provider.choose_cards(\n            CardSelectionRequest(\n                request_id="bad-bottom-order",\n                actor_id="P0",\n                ability_id="impulse",\n                purpose="ORDER_LIBRARY_BOTTOM",\n                turn_number=3,\n                observation=request.observation,\n                candidates=cards,\n                minimum=2,\n                maximum=3,\n            )\n        )\n'''
          test_path.write_text(test_text)
          PY
      - name: Format changed Python
        run: |
          uv run ruff format src/mtg_policy/choices.py src/mtg_runs/phase_c.py src/mtg_runs/phase_c_runner.py src/mtg_runs/phase_c_artifacts.py src/mtg_runs/phase_c_pairing.py tests/phase_c/test_phase_c_control.py tests/phase_c/test_phase_c_artifacts.py
      - name: Lint
        run: uv run ruff check .
      - name: Strict type check
        run: uv run mypy src
      - name: Focused Phase C tests
        run: uv run pytest tests/phase_c -q
      - name: Full repository tests
        run: uv run pytest -q
      - name: Boundary and manifest gates
        run: |
          uv run python scripts/check_clean_engine_boundary.py
          uv run python scripts/check_manifest.py
      - name: No-game dry run
        run: uv run mtg-engine phase-c-dry-run
      - name: Verify change scope and publish bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --check
          git status --short
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "199175422+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add docs/spec/phase-c/PHASE_C_PILOT_CONFIG.json docs/spec/phase-c/PHASE_C_PILOT_AUTHORIZATION.md src/mtg_policy/choices.py src/mtg_runs/phase_c.py src/mtg_runs/phase_c_runner.py src/mtg_runs/phase_c_artifacts.py src/mtg_runs/phase_c_pairing.py tests/phase_c/test_phase_c_control.py tests/phase_c/test_phase_c_artifacts.py
          git commit -m "Pair exploratory pilot to frozen standard environment subset"
          git push --force origin HEAD:refs/heads/bridge/phase-c-paired-redesign
          echo "BRIDGE_COMMIT=$(git rev-parse HEAD)"
