name: Apply Exact Ruff Slice 2 Formatting

on:
  push:
    branches:
      - engine/phase-b-full-deck-policy
    paths:
      - .github/workflows/apply-ruff-slice2.yml

permissions:
  actions: read
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Download exact Ruff artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/ruff-slice2
          gh run download 30693127282 \
            --repo "${GITHUB_REPOSITORY}" \
            --name ruff-formatted-8bb97ed9d9294f5aa629af9f33048a0a232feb81 \
            --dir /tmp/ruff-slice2
      - name: Verify exact formatted blobs
        run: |
          test "$(git hash-object /tmp/ruff-slice2/src/mtg_kernel/phase_b_actions.py)" = \
            "0a3915e3984b26f44689beb997bac79b256d76de"
          test "$(git hash-object /tmp/ruff-slice2/src/mtg_policy/broker.py)" = \
            "ce6b2ee9d0de9581af8cfc855a51a17557828988"
          test "$(git hash-object /tmp/ruff-slice2/tests/phase_b/test_broker_fail_closed.py)" = \
            "75253304c60d24211142275ba0b5d94488d0bd66"
      - name: Commit ordinary formatted files
        run: |
          cp /tmp/ruff-slice2/src/mtg_kernel/phase_b_actions.py src/mtg_kernel/phase_b_actions.py
          cp /tmp/ruff-slice2/src/mtg_policy/broker.py src/mtg_policy/broker.py
          cp /tmp/ruff-slice2/tests/phase_b/test_broker_fail_closed.py tests/phase_b/test_broker_fail_closed.py
          python -m py_compile \
            src/mtg_kernel/phase_b_actions.py \
            src/mtg_policy/broker.py \
            tests/phase_b/test_broker_fail_closed.py
          git diff --check
          test "$(git hash-object src/mtg_kernel/phase_b_actions.py)" = \
            "0a3915e3984b26f44689beb997bac79b256d76de"
          test "$(git hash-object src/mtg_policy/broker.py)" = \
            "ce6b2ee9d0de9581af8cfc855a51a17557828988"
          test "$(git hash-object tests/phase_b/test_broker_fail_closed.py)" = \
            "75253304c60d24211142275ba0b5d94488d0bd66"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/mtg_kernel/phase_b_actions.py \
            src/mtg_policy/broker.py \
            tests/phase_b/test_broker_fail_closed.py
          git commit -m "Apply Ruff formatting to fail-closed Slice 2 repair"
          git push origin HEAD:${{ github.ref_name }}
