name: Apply Phase A review hardening

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - name: Apply reviewed priority hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path('src/mtg_kernel/engine.py')
          text = engine.read_text(encoding='utf-8')
          replacements = [
              (
                  '''            mana_ability = bool(selected.get("mana_ability"))\n            if not mana_ability and self.state.turn.priority_holder_id != actor:\n                raise IllegalAction("the activating player does not have priority")\n''',
                  '''            if self.state.turn.priority_holder_id != actor:\n                raise IllegalAction("the activating player does not have priority")\n            mana_ability = bool(selected.get("mana_ability"))\n''',
              ),
              (
                  '''                    self.resolve_top(_record=False, _all_players_passed=True)\n''',
                  '''                    self._resolve_top_after_priority_passes()\n''',
              ),
              (
                  '''    def resolve_top(\n        self,\n        *,\n        _record: bool = True,\n        _all_players_passed: bool = False,\n    ) -> None:\n        self._ensure_active()\n        before = self._begin_atomic()\n        try:\n            if not _all_players_passed:\n                raise IllegalAction("the stack resolves only after all players pass priority")\n            if not self.state.stack:\n''',
                  '''    def resolve_top(self, *, _record: bool = True) -> None:\n        del _record\n        self._ensure_active()\n        raise IllegalAction("the stack resolves only after all players pass priority")\n\n    def _resolve_top_after_priority_passes(self) -> None:\n        self._ensure_active()\n        before = self._begin_atomic()\n        try:\n            if not self.state.stack:\n''',
              ),
              (
                  '''            if _record:\n                self._record_command("resolve_top")\n        except Exception:\n''',
                  '''        except Exception:\n''',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one engine transformation target: {old[:80]!r}')
              text = text.replace(old, new, 1)
          engine.write_text(text, encoding='utf-8')

          tests = Path('tests/phase_a/test_kernel_acceptance.py')
          text = tests.read_text(encoding='utf-8')
          old = '''def test_nonmana_activation_requires_priority_but_mana_ability_keeps_exception() -> None:\n    state, executor = funded_game()\n    specs = specs_by_name()\n    lantern = add_card(executor, specs["Soul-Guide Lantern"], Zone.BATTLEFIELD)\n    island = add_card(executor, specs["Island"], Zone.BATTLEFIELD)\n    state.turn.priority_holder_id = "P1"\n\n    before = state_hash(state)\n    with pytest.raises(IllegalAction, match="does not have priority"):\n        executor.activate("P0", lantern.object_id, "lantern:exile-opponents")\n    assert state_hash(state) == before\n\n    state.players["P0"].mana_pool["U"] = 0\n    executor.activate("P0", island.object_id, "island:mana-u")\n    assert state.players["P0"].mana_pool["U"] == 1\n    assert state.turn.priority_holder_id == "P1"\n'''
          new = '''def test_activated_abilities_require_priority_including_standalone_mana_abilities() -> None:\n    state, executor = funded_game()\n    specs = specs_by_name()\n    lantern = add_card(executor, specs["Soul-Guide Lantern"], Zone.BATTLEFIELD)\n    island = add_card(executor, specs["Island"], Zone.BATTLEFIELD)\n    state.turn.priority_holder_id = "P1"\n    state.players["P0"].mana_pool["U"] = 0\n\n    before = state_hash(state)\n    with pytest.raises(IllegalAction, match="does not have priority"):\n        executor.activate("P0", lantern.object_id, "lantern:exile-opponents")\n    assert state_hash(state) == before\n\n    with pytest.raises(IllegalAction, match="does not have priority"):\n        executor.activate("P0", island.object_id, "island:mana-u")\n    assert state_hash(state) == before\n\n    state.turn.priority_holder_id = "P0"\n    executor.activate("P0", island.object_id, "island:mana-u")\n    assert state.players["P0"].mana_pool["U"] == 1\n    assert state.turn.priority_holder_id == "P0"\n'''
          if text.count(old) != 1:
              raise SystemExit('activation regression test transformation target missing')
          text = text.replace(old, new, 1)
          old = '''    with pytest.raises(IllegalAction, match="only after all players pass"):\n        executor.resolve_top()\n    assert state_hash(state) == before\n    assert state.stack[-1] == spell.object_id\n\n    with pytest.raises(IllegalAction, match="only after all players pass"):\n'''
          new = '''    with pytest.raises(IllegalAction, match="only after all players pass"):\n        executor.resolve_top()\n    assert state_hash(state) == before\n    assert state.stack[-1] == spell.object_id\n\n    with pytest.raises(TypeError):\n        executor.resolve_top(_all_players_passed=True)  # type: ignore[call-arg]\n    assert state_hash(state) == before\n    assert state.stack[-1] == spell.object_id\n\n    with pytest.raises(IllegalAction, match="only after all players pass"):\n'''
          if text.count(old) != 1:
              raise SystemExit('resolution bypass regression test transformation target missing')
          tests.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/apply-phase-a-review-hardening.yml').unlink()
          PY
      - name: Validate reviewed hardening
        run: |
          uv sync --frozen --all-extras
          uv run ruff format src/mtg_kernel/engine.py tests/phase_a/test_kernel_acceptance.py
          uv run ruff check src/mtg_kernel/engine.py tests/phase_a/test_kernel_acceptance.py
          uv run pytest -q tests/phase_a
      - name: Commit ordinary source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Harden priority and stack resolution entry points"
          git push origin HEAD:agent/phase-a-post-merge-corrections
