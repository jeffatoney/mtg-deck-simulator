name: PR29 Autoformat

on:
  push:
    branches:
      - codex/capture-pytest-failures-and-classify-issues

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/capture-pytest-failures-and-classify-issues
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Apply Ruff formatting
        run: uv run ruff format .
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Ruff formatting to PR 29 fixes"
          git push origin HEAD:codex/capture-pytest-failures-and-classify-issues
