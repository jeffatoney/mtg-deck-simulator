name: TEMP Phase C V2 Source Autofix

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Apply V2 source corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          policy = Path("src/mtg_policy/exploratory_v2.py")
          text = policy.read_text(encoding="utf-8")
          text = text.replace(
              "from dataclasses import asdict, dataclass",
              "from dataclasses import dataclass",
          )
          phase_start = text.index('    phase = str(observation.get("phase", ""))')
          phase_end = text.index(
              "        hold = permitted_main_phase_pass_reason(observation, all_actions)",
              phase_start,
          )
          text = (
              text[:phase_start]
              + '''    phase = str(observation.get("phase", ""))
              step = str(observation.get("step", ""))
              main_phase = phase in {"PRECOMBAT_MAIN", "POSTCOMBAT_MAIN"} or step in {
                  "PRECOMBAT_MAIN",
                  "POSTCOMBAT_MAIN",
              }
              land_available = any(candidate.kind == "PLAY_LAND" for candidate in all_actions)
              if action.kind == "PASS_PRIORITY" and main_phase and land_available:
          '''
              + text[phase_end:]
          )
          selection_start = text.index("    def _select_single_card(")
          selection_end = text.index("    def choose_tutor(", selection_start)
          selection_block = '''    def _select_zero_or_one_card(
              self,
              request: CardSelectionRequest,
              baseline: CardSelection,
          ) -> CardSelection:
              if request.maximum != 1 or request.minimum not in {0, 1}:
                  raise ValueError("directed zero-or-one selection received incompatible bounds")
              if len(baseline.selected_handles) > 1:
                  raise ValueError("zero-or-one directed selection has an invalid baseline")

              fail_handle = "__LEGAL_FAIL_TO_FIND__"
              baseline_handle = baseline.selected_handles[0] if baseline.selected_handles else fail_handle
              candidates: list[DirectedCandidate] = []
              exclusions: list[dict[str, Any]] = []
              cards_by_handle = {card.handle: card for card in request.candidates}
              purpose_upper = request.purpose.upper()
              glint_restricted_choice = any(
                  marker in purpose_upper
                  for marker in ("TUTOR", "SEARCH", "TRANSMUTE", "TYPECYCLE")
              )
              for card in request.candidates:
                  signature = canonical_interaction_signature(
                      purpose=request.purpose,
                      action_kind="CARD_SELECTION",
                      identity=card.identity,
                      metadata={"ability_id": request.ability_id},
                  )
                  prohibited = (
                      self.config.no_glint_horn_tutoring
                      and glint_restricted_choice
                      and card.identity == GLINT_HORN
                  )
                  status = "PROHIBITED_NO_GLINT_TUTOR" if prohibited else "ALLOWED"
                  prune = "ARM_CONSTRAINT_NO_GLINT_HORN_TUTOR" if prohibited else None
                  if prohibited:
                      exclusions.append(
                          {
                              "identity": GLINT_HORN,
                              "reason": "ARM_CONSTRAINT_NO_GLINT_HORN_TUTOR",
                              "legal_alternative_identities": sorted(
                                  candidate.identity
                                  for candidate in request.candidates
                                  if candidate.identity != GLINT_HORN
                              ),
                              "fail_to_find_legally_available": request.minimum == 0,
                          }
                      )
                  candidates.append(
                      DirectedCandidate(
                          handle=card.handle,
                          semantic_key=f"{card.identity}:{request.purpose}",
                          score=_public_card_score(
                              card,
                              request.observation,
                              self.combo_packages,
                              purpose=request.purpose,
                              novelty_value=self.novelty.novelty_value(signature),
                              constraint_status=status,
                              baseline_selected=card.handle == baseline_handle,
                          ),
                          pruned_reason=prune,
                      )
                  )

              if request.minimum == 0:
                  fail_signature = canonical_interaction_signature(
                      purpose=request.purpose,
                      action_kind="CARD_SELECTION_FAIL_TO_FIND",
                      identity=None,
                      metadata={"ability_id": request.ability_id},
                  )
                  candidates.append(
                      DirectedCandidate(
                          handle=fail_handle,
                          semantic_key=f"FAIL_TO_FIND:{request.purpose}",
                          score=CandidateScoreVector(
                              immediate_deterministic_access=False,
                              projected_deterministic_access=False,
                              earliest_projected_access_turn=None,
                              known_package_progress=0,
                              mana_development_value=0,
                              relevant_resource_preservation=100,
                              card_selection_or_tutor_value=0,
                              conditional_access_status="NONE",
                              novelty_value=self.novelty.novelty_value(fail_signature),
                              arm_constraint_status="ALLOWED",
                              action_cost=0,
                              reason_codes=("LEGAL_FAIL_TO_FIND",),
                          ),
                      )
                  )

              if not candidates:
                  return CardSelection(
                      baseline.selected_handles,
                      self.evaluator_id,
                      self.evaluator_sha256,
                      {
                          **dict(baseline.diagnostics),
                          "exploratory_arm_id": self.config.arm_id,
                          "selection_reason": "NO_CANDIDATE_DELEGATED_TO_FROZEN_STANDARD",
                      },
                  )
              if baseline_handle not in {candidate.handle for candidate in candidates}:
                  raise ValueError("STANDARD baseline is not a legal zero-or-one candidate")

              decision_id = self._decision_id(request.request_id, request.purpose)
              selection = select_directed_candidate(
                  self.config,
                  candidates,
                  baseline_handle=baseline_handle,
                  exploration_seed=self.exploration_seed,
                  decision_id=decision_id,
              )
              selected_handles: tuple[str, ...]
              selected_identity: str | None
              selected_signature: str
              if selection.selected_handle == fail_handle:
                  selected_handles = ()
                  selected_identity = None
                  selected_signature = canonical_interaction_signature(
                      purpose=request.purpose,
                      action_kind="CARD_SELECTION_FAIL_TO_FIND",
                      identity=None,
                      metadata={"ability_id": request.ability_id},
                  )
              else:
                  selected_card = cards_by_handle[selection.selected_handle]
                  selected_handles = (selection.selected_handle,)
                  selected_identity = selected_card.identity
                  selected_signature = canonical_interaction_signature(
                      purpose=request.purpose,
                      action_kind="CARD_SELECTION",
                      identity=selected_card.identity,
                      metadata={"ability_id": request.ability_id},
                  )
              self.novelty.visit(selected_signature)
              self._record_selection(
                  request_id=request.request_id,
                  purpose=request.purpose,
                  baseline_handle=baseline_handle,
                  selection=selection,
                  exclusions=exclusions,
              )
              ranked_by_handle = {candidate.handle: candidate for candidate in selection.candidates}
              candidate_handles = [card.handle for card in request.candidates]
              if request.minimum == 0:
                  candidate_handles.append(fail_handle)
              return CardSelection(
                  selected_handles,
                  self.evaluator_id,
                  self.evaluator_sha256,
                  {
                      "policy_config_id": self.baseline.bundle.policy_config_id,
                      "exploratory_arm_id": self.config.arm_id,
                      "baseline_selected_handles": list(baseline.selected_handles),
                      "selected_identity": selected_identity,
                      "selection_reason": selection.selection_reason,
                      "candidate_evaluations": [
                          {
                              "identity": (
                                  cards_by_handle[handle].identity
                                  if handle in cards_by_handle
                                  else None
                              ),
                              "handle": handle,
                              "score": ranked_by_handle[handle].score.to_dict(),
                              "pruned_reason": ranked_by_handle[handle].pruned_reason,
                          }
                          for handle in candidate_handles
                      ],
                      "arm_specific_exclusions": exclusions,
                  },
              )

          def choose_cards(self, request: CardSelectionRequest) -> CardSelection:
              baseline = self.baseline.choose_cards(request)
              if request.maximum == 1 and request.minimum in {0, 1}:
                  return self._select_zero_or_one_card(request, baseline)

              combination_count = 0
              for count in range(request.minimum, request.maximum + 1):
                  combination_count += sum(1 for _ in combinations(request.candidates, count))
                  if combination_count > 64:
                      break
              self.records.append(
                  {
                      "schema_version": "phase-c-exploratory-v2-strategic-choice-v1",
                      "arm_id": self.config.arm_id,
                      "game_index": self.game_index,
                      "environment_seed": self.environment_seed,
                      "exploration_seed": self.exploration_seed,
                      "decision_id": self._decision_id(request.request_id, request.purpose),
                      "strategic_choice_purpose": request.purpose,
                      "standard_baseline_handle": list(baseline.selected_handles),
                      "candidate_evaluations": [],
                      "pruned_candidates": [
                          {
                              "scope": "MULTI_CARD_SELECTION_COMBINATIONS",
                              "candidate_count": combination_count,
                              "reason": "MULTI_CARD_SELECTION_DELEGATED_TO_FROZEN_STANDARD",
                          }
                      ],
                      "selected_action": list(baseline.selected_handles),
                      "selection_reason": "FROZEN_STANDARD_MULTI_CARD_SELECTION",
                      "randomness_affected_selection": False,
                  }
              )
              return CardSelection(
                  baseline.selected_handles,
                  self.evaluator_id,
                  self.evaluator_sha256,
                  {
                      **dict(baseline.diagnostics),
                      "exploratory_arm_id": self.config.arm_id,
                      "selection_reason": "FROZEN_STANDARD_MULTI_CARD_SELECTION",
                  },
              )

          '''
          text = text[:selection_start] + selection_block + text[selection_end:]
          policy.write_text(text, encoding="utf-8")

          runner = Path("src/mtg_runs/phase_c_exploratory_v2.py")
          text = runner.read_text(encoding="utf-8")
          text = text.replace("    CandidateScoreVector,\n", "")
          text = text.replace(
              '    seed_text = f"phase-c-v2:{arm_id}:{seed}"',
              '    seed_text = f"phase-c:standard:{seed}"',
          )
          text = text.replace(
              '''        broker.execute(int(observation["generation"]), match.handle)
              after = _combo_evaluation(clone, tracker)
              continuation: list[str] = []
          ''',
              '''        broker.execute(int(observation["generation"]), match.handle)
              after_deviation = _combo_evaluation(clone, tracker)
              projected = after_deviation
              continuation: list[str] = []
          ''',
          )
          text = text.replace(
              '''            next_broker.execute(int(next_observation["generation"]), selected.handle)
                  after = _combo_evaluation(clone, tracker)
              else:
                  stop_reason = "CONTINUATION_ACTION_LIMIT"

              projected_turn = None if after.expected_win_turn >= 99 else after.expected_win_turn
              return PublicProjection(
                  immediate_deterministic_access=after.immediate_legal_table_win,
                  projected_deterministic_access=after.immediate_legal_table_win,
          ''',
              '''            next_broker.execute(int(next_observation["generation"]), selected.handle)
                  projected = _combo_evaluation(clone, tracker)
              else:
                  stop_reason = "CONTINUATION_ACTION_LIMIT"

              projected_turn = None if projected.expected_win_turn >= 99 else projected.expected_win_turn
              return PublicProjection(
                  immediate_deterministic_access=after_deviation.immediate_legal_table_win,
                  projected_deterministic_access=projected.immediate_legal_table_win,
          ''',
          )
          runner.write_text(text, encoding="utf-8")
          PY
      - name: Format and lint corrected sources
        run: |
          uv run ruff format \
            src/mtg_policy/exploratory_v2.py \
            src/mtg_runs/phase_c_exploratory_v2.py \
            src/mtg_runs/phase_c_exploratory_v2_diagnostic.py \
            src/mtg_search/directed_v2.py
          uv run ruff check \
            src/mtg_policy/exploratory_v2.py \
            src/mtg_runs/phase_c_exploratory_v2.py \
            src/mtg_runs/phase_c_exploratory_v2_diagnostic.py \
            src/mtg_search/directed_v2.py
          uv run mypy src/mtg_policy/exploratory_v2.py src/mtg_runs/phase_c_exploratory_v2.py src/mtg_runs/phase_c_exploratory_v2_diagnostic.py src/mtg_search/directed_v2.py
          uv run pytest tests/phase_c/test_exploratory_v2_*.py
      - name: Remove temporary workflow and commit source result
        run: |
          rm .github/workflows/phase-c-v2-source-autofix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: harden and format exploratory V2 source"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
