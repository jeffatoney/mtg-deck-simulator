name: Staging PR 100 apply repository integrity repair

on:
  push:
    branches:
      - staging/pr100-evidence-integrity

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Apply exact prepared repair and validate final tree
        shell: bash
        run: |
          set -euo pipefail
          payload_b64="${RUNNER_TEMP}/pr100-integrity-text.b64"
          payload_tgz="${RUNNER_TEMP}/pr100-integrity-text.tar.gz"
          cat > "${payload_b64}" <<'PAYLOAD'

PAYLOAD
          base64 --decode "${payload_b64}" > "${payload_tgz}"
          echo 'ad8533dcc66316310cec65dcbff6901c838687b9bcbb57f995ac3acbb92b9b55  '"${payload_tgz}" | sha256sum --check
          echo '7e314f859d1e774b232f1d3daeed146441553e8f31c9aa0615a428d37a8aad8a  docs/audit/phase-c-postpilot/evidence/PR100_PUBLIC_TIEBREAK_EXACT_HEAD_EVIDENCE.zip' | sha256sum --check
          tar --extract --gzip --file "${payload_tgz}" --directory "${GITHUB_WORKSPACE}"
          rm -f -- \
            '.github/diagnostics/pr100_finalize_behavioral_analysis.py.txt' \
            '.github/diagnostics/pr100_prepare_public_class_counterfactual.py' \
            '.github/diagnostics/pr100_public_tiebreak_diagnostic.py.txt' \
            '.github/workflows/pr100-commander-choice-fix-temporary-v2.yml' \
            '.github/workflows/pr100-commander-choice-fix-temporary-v3.yml' \
            '.github/workflows/pr100-commander-choice-fix-temporary.yml' \
            '.github/workflows/pr100-corrected-behavior-diagnostic.yml' \
            '.github/workflows/pr100-finalize-behavioral-analysis.yml' \
            '.github/workflows/pr100-normalize-counterfactual.yml' \
            '.github/workflows/pr100-parallel-finalize-behavioral-analysis.yml' \
            '.github/workflows/pr100-source-snapshot-diagnostic.yml' \
            '.github/workflows/public-policy-noninterference-first-failure.yml' \
            '.github/workflows/public-policy-noninterference-test-diagnostic.yml' \
            'scripts/pr100_apply_commander_choice_fix.py' \
            '.github/workflows/staging-pr100-import-evidence.yml' \
            '.github/workflows/staging-pr100-apply-integrity-repair.yml'
          python scripts/check_repository_integrity.py
          python scripts/check_phase_b_authority.py
          python -m py_compile \
            scripts/check_repository_integrity.py \
            scripts/check_phase_b_authority.py \
            src/mtg_verify/phase_b.py \
            tests/phase_b/test_repository_integrity.py \
            tests/phase_b/test_phase_b_verification.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'audit: preserve PR 100 evidence and enforce report integrity'
          git push origin "HEAD:${GITHUB_REF_NAME}"
