name: Phase A One-Time Autofix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  autofix:
    if: github.head_ref == 'engine/phase-a-rules-kernel' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engine/phase-a-rules-kernel
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --frozen --all-extras
      - name: Apply strict-typing corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/mtg_kernel/serialization.py')
          text = path.read_text()
          text = text.replace(
              '    data = _jsonable(asdict(state))\n    if not include_replay:',
              '    raw_data = _jsonable(asdict(state))\n'
              '    if not isinstance(raw_data, dict):\n'
              '        raise TypeError("serialized game state must be a JSON object")\n'
              '    data: dict[str, Any] = raw_data\n'
              '    if not include_replay:',
          )
          text = text.replace(
              '            tuple(_target(target) for target in value.get("targets", []) if target is not None),',
              '            tuple(\n'
              '                TargetRef(\n'
              '                    str(target["object_id"]),\n'
              '                    ReferenceMode(\n'
              '                        str(target.get("mode", ReferenceMode.CURRENT_OBJECT_REQUIRED.value))\n'
              '                    ),\n'
              '                    target.get("capability"),\n'
              '                    target.get("authority"),\n'
              '                )\n'
              '                for target in value.get("targets", [])\n'
              '                if target is not None\n'
              '            ),',
          )
          path.write_text(text)

          path = Path('src/mtg_kernel/hashing.py')
          text = path.read_text().replace(
              '    return _safe(document)\n',
              '    safe = _safe(document)\n'
              '    if not isinstance(safe, dict):\n'
              '        raise TypeError("state hash document must remain a JSON object")\n'
              '    return safe\n',
          )
          path.write_text(text)

          path = Path('src/mtg_kernel/engine.py')
          text = path.read_text().replace(
              '                    obj = self.identity.resolve_reference(ref)\n'
              '                except IllegalAction:\n'
              '                    continue\n'
              '                if isinstance(obj, GameObject):\n'
              '                    self.zones.move(\n'
              '                        obj.object_id,',
              '                    resolved_ref = self.identity.resolve_reference(ref)\n'
              '                except IllegalAction:\n'
              '                    continue\n'
              '                if isinstance(resolved_ref, GameObject):\n'
              '                    self.zones.move(\n'
              '                        resolved_ref.object_id,',
          )
          path.write_text(text)
          PY
      - name: Format, lint, and type check
        run: |
          uv run ruff format src scripts tests automation
          uv run ruff check src scripts tests
          uv run mypy src
      - name: Commit formatted correction
        run: |
          rm .github/workflows/phase-a-autofix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format and type-check Phase A rewrite"
          git push origin HEAD:engine/phase-a-rules-kernel
