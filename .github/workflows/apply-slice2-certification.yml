name: Apply Exact Slice 2 Certification

on:
  push:
    branches:
      - engine/phase-b-full-deck-policy
    paths:
      - .github/workflows/apply-slice2-certification.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Decode and verify exact CI-produced certification
        run: |
          base64 --decode automation/slice2-certification.b64 > /tmp/CERTIFICATION.json
          test "$(sha256sum /tmp/CERTIFICATION.json | cut -d' ' -f1)" = \
            "94f048278af16cded048eb95ce17b81ec382aaac9fe021940b70b0de6aa678b6"
          test "$(git hash-object /tmp/CERTIFICATION.json)" = \
            "1879cb915a2c7eab1c72b2f7da16ed068c2d41f1"
      - name: Commit exact durable record
        run: |
          cp /tmp/CERTIFICATION.json docs/audit/phase-a-certification/CERTIFICATION.json
          test "$(git hash-object docs/audit/phase-a-certification/CERTIFICATION.json)" = \
            "1879cb915a2c7eab1c72b2f7da16ed068c2d41f1"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit/phase-a-certification/CERTIFICATION.json
          git commit -m "Commit exact Slice 2 Phase A certification"
          git push origin HEAD:${{ github.ref_name }}

# This update triggers the verified one-shot transfer.
