name: PR 100 temporary commander-choice repair

on:
  push:
    branches:
      - hardening/public-policy-noninterference

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IDENTITY_MODEL_SHA256: ${{ vars.IDENTITY_MODEL_V2_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: hardening/public-policy-noninterference
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --frozen --all-extras
      - name: Apply general Rule 903.9a repair
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/commander-choice.patch" <<'PATCH'
          diff --git a/src/mtg_kernel/engine_core.py b/src/mtg_kernel/engine_core.py
          index b1765a7..9866d65 100644
          --- a/src/mtg_kernel/engine_core.py
          +++ b/src/mtg_kernel/engine_core.py
          @@ -1568,19 +1568,6 @@ class GameExecutor:
                                       self._event("SBA_AURA_TO_GRAVEYARD"),
                                   )
                                   changed = True
          -            for obj in list(self.state.objects.values()):
          -                if (
          -                    obj.retired
          -                    or obj.zone not in {Zone.GRAVEYARD, Zone.EXILE}
          -                    or not obj.component_card_instance_ids
          -                ):
          -                    continue
          -                instance = self.state.card_instances[obj.component_card_instance_ids[0]]
          -                if (
          -                    instance.commander_designation
          -                    and obj.object_id not in self.state.pending_commander_choices
          -                ):
          -                    self.state.pending_commander_choices.append(obj.object_id)
                       for player in self.state.players.values():
                           if player.in_game and (player.life <= 0 or player.failed_draw_count > 0):
                               player.in_game = False
          diff --git a/src/mtg_kernel/zones.py b/src/mtg_kernel/zones.py
          index 9fd1a52..eb9c8c4 100644
          --- a/src/mtg_kernel/zones.py
          +++ b/src/mtg_kernel/zones.py
          @@ -76,6 +76,8 @@ class ZoneService:
                   old = self.state.objects[object_id]
                   if old.retired or old.ceased_to_exist:
                       raise IllegalAction("cannot move a retired object")
          +        if object_id in self.state.pending_commander_choices:
          +            self.state.pending_commander_choices.remove(object_id)
                   self._remove_from_zone(old)
                   self.identity.snapshot_lki(old)
                   old.retired = True
          @@ -187,6 +189,11 @@ class ZoneService:
                           )
                       self.state.objects[successor.object_id] = successor
                       self.register(successor)
          +            if destination in {Zone.GRAVEYARD, Zone.EXILE} and any(
          +                self.state.card_instances[card_id].commander_designation
          +                for card_id in successor.component_card_instance_ids
          +            ):
          +                self.state.pending_commander_choices.append(successor.object_id)
           
                   change = ZoneChange(
                       self.identity.new_id("zone-change"),
          diff --git a/tests/phase_a/test_kernel_acceptance.py b/tests/phase_a/test_kernel_acceptance.py
          index 7c386c2..3a05f99 100644
          --- a/tests/phase_a/test_kernel_acceptance.py
          +++ b/tests/phase_a/test_kernel_acceptance.py
          @@ -592,6 +592,15 @@ def test_commander_optional_return_and_commander_damage_terminal() -> None:
                   assert grave.object_id in state.pending_commander_choices
                   declined = executor.commander_return_choice("P0", grave.object_id, False)
                   assert declined.zone is Zone.GRAVEYARD and state.choices[-1].selected == "DECLINE"
          +        executor.check_state_based_actions()
          +        assert grave.object_id not in state.pending_commander_choices
          +
          +        moved_again = executor.zones.move(
          +            grave.object_id, Zone.EXILE, "TEST", executor._event("TEST")
          +        )
          +        assert moved_again is not None
          +        executor.check_state_based_actions()
          +        assert state.pending_commander_choices == [moved_again.object_id]
           
                   state2, executor2 = funded_game()
                   commander2 = add_card(
          diff --git a/tests/phase_b/test_broker_fail_closed.py b/tests/phase_b/test_broker_fail_closed.py
          index 557661e..37c85b1 100644
          --- a/tests/phase_b/test_broker_fail_closed.py
          +++ b/tests/phase_b/test_broker_fail_closed.py
          @@ -134,8 +134,12 @@ def test_verified_niv_automatic_battlefield_behavior_allows_broker_refresh() ->
           def test_pending_commander_return_choice_suppresses_priority_actions() -> None:
               state, executor, specs = scenario("commander-choice")
               commander = add_card(
          -        executor, specs["Malcolm, Keen-Eyed Navigator"], Zone.EXILE, commander=True
          +        executor, specs["Malcolm, Keen-Eyed Navigator"], Zone.BATTLEFIELD, commander=True
               )
          +    exiled = executor.zones.move(
          +        commander.object_id, Zone.EXILE, "TEST", executor._event("TEST")
          +    )
          +    assert exiled is not None
               executor.check_state_based_actions()
               broker = ActionBroker(executor, "P0")
               observation, actions = broker.refresh()
          @@ -147,6 +151,6 @@ def test_pending_commander_return_choice_suppresses_priority_actions() -> None:
                   for obj in state.objects.values()
                   if not obj.retired
                   and obj.zone is Zone.COMMAND
          -        and obj.component_card_instance_ids == commander.component_card_instance_ids
          +        and obj.component_card_instance_ids == exiled.component_card_instance_ids
               ]
               assert len(successors) == 1 and not state.pending_commander_choices
          PATCH
          sed -i 's/^          //' "${RUNNER_TEMP}/commander-choice.patch"
          git apply --check "${RUNNER_TEMP}/commander-choice.patch"
          git apply "${RUNNER_TEMP}/commander-choice.patch"
          uv run pytest -q \
            tests/phase_a/test_kernel_acceptance.py::test_commander_optional_return_and_commander_damage_terminal \
            tests/phase_b/test_broker_fail_closed.py::test_pending_commander_return_choice_suppresses_priority_actions
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/mtg_kernel/engine_core.py \
            src/mtg_kernel/zones.py \
            tests/phase_a/test_kernel_acceptance.py \
            tests/phase_b/test_broker_fail_closed.py
          git commit -m 'fix: offer commander graveyard or exile choice once per move'
          git push origin HEAD:hardening/public-policy-noninterference
