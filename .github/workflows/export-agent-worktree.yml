name: Export agent worktree

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Create source archive
        run: |
          tar --exclude=.git -czf "${RUNNER_TEMP}/mtg-deck-simulator-source.tgz" .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: agent-worktree-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/mtg-deck-simulator-source.tgz
          if-no-files-found: error
          retention-days: 1
