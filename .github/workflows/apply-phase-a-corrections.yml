name: Apply Phase A corrective source patch

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Stop until the complete reviewed patch is present
        id: patch
        run: |
          if [[ -f .phase-a-corrections.patch.sha256 ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.patch.outputs.present == 'true'
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        if: steps.patch.outputs.present == 'true'
        with:
          version: latest
      - name: Reassemble and validate transparent corrective patch
        if: steps.patch.outputs.present == 'true'
        run: |
          # The contents API added one trailing space to chunk 00. Remove that
          # transport-only byte, then reconstruct the exact reviewed patch.
          head -c -1 .phase-a-corrections.patch.part-00 > .phase-a-corrections.patch
          cat .phase-a-corrections.patch.part-0[1-6] >> .phase-a-corrections.patch
          sha256sum --check .phase-a-corrections.patch.sha256
          git apply --check .phase-a-corrections.patch
          git apply .phase-a-corrections.patch
          rm .phase-a-corrections.patch .phase-a-corrections.patch.part-* .phase-a-corrections.patch.sha256
          rm .github/workflows/apply-phase-a-corrections.yml
          rm .github/workflows/export-agent-worktree.yml
      - name: Format and validate corrective source
        if: steps.patch.outputs.present == 'true'
        run: |
          uv sync --frozen --all-extras
          uv run ruff format src/mtg_kernel/engine.py src/mtg_verify/phase_a.py scripts/_phase_a_paths.py scripts/check_phase_a_certification.py scripts/check_phase_a_golden_transcripts.py scripts/record_phase_a_certification.py tests/phase_a/test_kernel_acceptance.py tests/test_certification_gate.py tests/test_golden_transcript_gate.py
          uv run ruff check src/mtg_kernel/engine.py src/mtg_verify/phase_a.py scripts/_phase_a_paths.py scripts/check_phase_a_certification.py scripts/check_phase_a_golden_transcripts.py scripts/record_phase_a_certification.py tests/phase_a/test_kernel_acceptance.py tests/test_certification_gate.py tests/test_golden_transcript_gate.py
          uv run pytest -q tests/phase_a tests/test_golden_transcript_gate.py
      - name: Commit ordinary source changes
        if: steps.patch.outputs.present == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Repair Phase A post-merge correctness findings"
          git push origin HEAD:agent/phase-a-post-merge-corrections
