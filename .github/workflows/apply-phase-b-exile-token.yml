name: Apply Phase B Exile Token Primitive

on:
  push:
    branches:
      - engine/phase-b-full-deck-policy
    paths:
      - .github/workflows/apply-phase-b-exile-token.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply exact reviewed patch
        run: |
          git apply --check automation/phase-b-exile-token.patch
          git apply automation/phase-b-exile-token.patch
      - name: Verify exact source result
        run: |
          python -m py_compile src/mtg_kernel/phase_b_actions.py
          git diff --check
          test "$(git hash-object src/mtg_kernel/phase_b_actions.py)" = "add9a54008856481375699f3d219ea1473cf3afb"
      - name: Commit ordinary source diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mtg_kernel/phase_b_actions.py
          git commit -m "Resolve exile-and-token effects through the production executor"
          git push origin HEAD:${{ github.ref_name }}
