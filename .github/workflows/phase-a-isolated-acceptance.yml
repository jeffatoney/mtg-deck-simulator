name: Acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  isolated-reference-suite:
    name: isolated-reference-suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Check out protected main runner
        uses: actions/checkout@v4
        with:
          ref: main
          path: referee
          persist-credentials: false
      - name: Record exact candidate commit
        run: test "$(git -C candidate rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Run protected closed-world reference runner
        run: >-
          python referee/scripts/run_phase_a_reference_tests.py
          --candidate candidate --referee referee
          --candidate-sha "${{ github.event.pull_request.head.sha }}"
          --output artifacts/phase-a-reference
