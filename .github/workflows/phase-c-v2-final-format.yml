name: TEMP Phase C V2 Final Format

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Apply repository formatter
        run: uv run ruff format .
      - name: Require corrected Python parses
        run: |
          python -m py_compile \
            src/mtg_search/directed_v2.py \
            src/mtg_policy/exploratory_v2.py \
            src/mtg_policy/exploratory_v2_strategic.py \
            src/mtg_runs/phase_c_mulligan_v2.py \
            src/mtg_runs/phase_c_exploratory_v2.py \
            src/mtg_runs/phase_c_exploratory_v2_diagnostic.py
      - name: Remove temporary workflow and commit formatter output
        run: |
          rm .github/workflows/phase-c-v2-final-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style: format final exploratory V2 validation source"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
