name: Run PR98 Governance Repair

on:
  push:
    branches:
      - phase-c/study-definition-binding

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: phase-c/study-definition-binding
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Apply repair
        run: uv run python scripts/pr98_governance_repair.py
      - name: Format
        run: uv run ruff format scripts/_phase_b_paths.py src/mtg_runs/phase_c.py tests/phase_c/test_phase_c_governance_binding.py tests/phase_c/test_phase_c_study_binding.py tests/phase_c/test_phase_c_control.py
      - name: Lint
        run: uv run ruff check scripts/_phase_b_paths.py src/mtg_runs/phase_c.py tests/phase_c/test_phase_c_governance_binding.py tests/phase_c/test_phase_c_study_binding.py tests/phase_c/test_phase_c_control.py
      - name: Type check
        run: uv run mypy src
      - name: Focused tests
        run: uv run pytest -q tests/phase_c/test_phase_c_governance_binding.py tests/phase_c/test_phase_c_study_binding.py tests/phase_c/test_phase_c_control.py
      - name: Publish durable repair only
        run: |
          git rm .github/workflows/pr98-governance-repair.yml
          git rm .github/workflows/pr98-governance-runner.yml
          git rm scripts/pr98_governance_repair.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/_phase_b_paths.py src/mtg_runs/phase_c.py tests/phase_c/test_phase_c_governance_binding.py tests/phase_c/test_phase_c_study_binding.py tests/phase_c/test_phase_c_control.py
          git diff --cached --check
          git commit -m "Repair Phase C activation governance binding"
          git push origin HEAD:phase-c/study-definition-binding
