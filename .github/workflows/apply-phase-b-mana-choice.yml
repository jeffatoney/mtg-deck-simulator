name: Apply Phase B Mana Choice Primitive

on:
  push:
    branches:
      - engine/phase-b-full-deck-policy
    paths:
      - .github/workflows/apply-phase-b-mana-choice.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply exact reviewed patch
        run: |
          git apply --check automation/phase-b-mana-choice.patch
          git apply automation/phase-b-mana-choice.patch
      - name: Verify exact source result
        run: |
          python -m py_compile src/mtg_kernel/phase_b_actions.py src/mtg_policy/broker.py
          git diff --check
          test "$(git hash-object src/mtg_kernel/phase_b_actions.py)" = "ad8c6b22eb0f98e2d7bb214a35e0ddfdce0a916a"
          test "$(git hash-object src/mtg_policy/broker.py)" = "e6e3bd6ccda54b30c2f460ef936903d5cb18b5e2"
      - name: Commit ordinary source diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mtg_kernel/phase_b_actions.py src/mtg_policy/broker.py
          git commit -m "Enumerate and execute explicit damaging mana choices"
          git push origin HEAD:${{ github.ref_name }}
