name: TEMP Finalize Phase C V2 Strategic Evidence

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Finalize strategic evidence boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/mtg_policy/exploratory_v2_strategic.py")
          text = path.read_text(encoding="utf-8")

          old_exclusion = (
              '        if prohibited:\n'
              '            exclusion = {\n'
              '                "identity": GLINT_HORN,\n'
              '                "candidate_handle": handle,\n'
              '                "reason": "ARM_CONSTRAINT_NO_GLINT_HORN_TUTOR",\n'
              '            }\n'
          )
          new_exclusion = (
              '        if prohibited:\n'
              '            exclusion = {\n'
              '                "identity": GLINT_HORN,\n'
              '                "candidate_handle": handle,\n'
              '                "reason": "ARM_CONSTRAINT_NO_GLINT_HORN_TUTOR",\n'
              '                "legal_alternative_identities": sorted(\n'
              '                    card.identity\n'
              '                    for card in request.candidates\n'
              '                    if card.identity != GLINT_HORN\n'
              '                ),\n'
              '                "fail_to_find_legally_available": request.minimum == 0,\n'
              '            }\n'
          )
          if old_exclusion not in text:
              raise SystemExit("card-selection exclusion marker missing")
          text = text.replace(old_exclusion, new_exclusion, 1)

          fof_start = text.index("    def choose_fact_or_fiction(")
          insert_at = text.index("        for split in request.legal_splits:\n", fof_start)
          opponent_pruning = (
              '        opponent_pruning = [\n'
              '            {\n'
              '                "split_index": split.split_index,\n'
              '                "reason": "OPPONENT_CHOICE_FIXED_TO_FROZEN_STANDARD_MINIMIZER",\n'
              '            }\n'
              '            for split in request.legal_splits\n'
              '            if split.split_index != baseline.split_index\n'
              '        ]\n'
          )
          text = text[:insert_at] + opponent_pruning + text[insert_at:]
          loop = (
              '        for split in request.legal_splits:\n'
              '            for pile_name, pile_handles in (\n'
          )
          replacement = (
              '        for split in request.legal_splits:\n'
              '            if split.split_index != baseline.split_index:\n'
              '                continue\n'
              '            for pile_name, pile_handles in (\n'
          )
          loop_pos = text.index(loop, fof_start)
          text = text[:loop_pos] + replacement + text[loop_pos + len(loop):]
          selection_pos = text.index(
              '            replay_binding={"opponent_id": request.opponent_id},\n',
              fof_start,
          )
          text = text[:selection_pos] + '            extra_pruning=opponent_pruning,\n' + text[selection_pos:]
          path.write_text(text, encoding="utf-8")

          policy = Path("src/mtg_policy/exploratory_v2.py")
          text = policy.read_text(encoding="utf-8")
          start = text.index("def assert_no_glint_tutor_selection(")
          end = text.index("\n\n__all__ = [", start)
          function = (
              'def assert_no_glint_tutor_selection(records: Sequence[Mapping[str, Any]]) -> None:\n'
              '    """Fail closed if Arm 2 selects Glint-Horn through any library-search choice."""\n'
              '\n'
              '    markers = ("TUTOR", "SEARCH", "TRANSMUTE", "TYPECYCLE", "LANDCYCLE")\n'
              '    for record in records:\n'
              '        if str(record.get("arm_id", "")) != ALT_PACKAGE_ARM:\n'
              '            continue\n'
              '        purpose = str(record.get("strategic_choice_purpose", "")).upper()\n'
              '        if not any(marker in purpose for marker in markers):\n'
              '            continue\n'
              '        selected = str(record.get("selected_action", ""))\n'
              '        if selected == f"TUTOR:{GLINT_HORN}":\n'
              '            raise ValueError("Arm 2 selected prohibited Glint-Horn tutor target")\n'
              '        evaluations = record.get("candidate_evaluations", ())\n'
              '        if not isinstance(evaluations, Sequence):\n'
              '            continue\n'
              '        selected_rows = [\n'
              '            row\n'
              '            for row in evaluations\n'
              '            if isinstance(row, Mapping) and str(row.get("handle", "")) == selected\n'
              '        ]\n'
              '        if len(selected_rows) != 1:\n'
              '            continue\n'
              '        semantic = str(selected_rows[0].get("semantic_key", ""))\n'
              '        if GLINT_HORN.upper() in semantic.upper():\n'
              '            raise ValueError("Arm 2 selected Glint-Horn through a prohibited search choice")\n'
          )
          policy.write_text(text[:start] + function + text[end:], encoding="utf-8")
          PY
      - name: Format and validate V2 source
        run: |
          uv run ruff format \
            src/mtg_policy/exploratory_v2.py \
            src/mtg_policy/exploratory_v2_strategic.py \
            tests/phase_c/test_exploratory_v2_strategic_choices.py
          uv run ruff check \
            src/mtg_policy/exploratory_v2.py \
            src/mtg_policy/exploratory_v2_strategic.py \
            tests/phase_c/test_exploratory_v2_strategic_choices.py
          uv run mypy src/mtg_policy/exploratory_v2.py src/mtg_policy/exploratory_v2_strategic.py
          uv run pytest tests/phase_c/test_exploratory_v2_*.py
      - name: Remove temporary workflow and commit validated source
        run: |
          rm .github/workflows/phase-c-v2-strategic-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: complete exploratory V2 strategic-choice evidence"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
