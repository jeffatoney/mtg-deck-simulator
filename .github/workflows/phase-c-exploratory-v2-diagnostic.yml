name: Phase C Exploratory V2 Non-Authorized Diagnostic

on:
  workflow_dispatch:
    inputs:
      implementation_commit:
        description: Exact non-authorized V2 implementation commit to diagnose
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  integrity-and-standard-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      IDENTITY_MODEL_SHA256: ${{ vars.IDENTITY_MODEL_V2_SHA256 }}
    steps:
      - name: Require exact commit input shape
        env:
          IMPLEMENTATION_COMMIT: ${{ inputs.implementation_commit }}
        run: |
          if [[ ! "${IMPLEMENTATION_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "implementation_commit must be one lowercase 40-character Git SHA" >&2
            exit 1
          fi
          test "${IMPLEMENTATION_COMMIT}" = "${GITHUB_SHA}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.implementation_commit }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Require clean exact implementation
        env:
          IMPLEMENTATION_COMMIT: ${{ inputs.implementation_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "${IMPLEMENTATION_COMMIT}"
          test -z "$(git status --porcelain)"
      - name: Reject pilot authorization and artifact roots
        run: |
          uv run python - <<'PY'
          from mtg_runs.phase_c import load_phase_c_config
          from mtg_search.directed_v2 import ARM_IDS, load_directed_arm_config

          phase_c = load_phase_c_config()
          assert phase_c.execution_allowed is False
          for arm in ARM_IDS:
              assert load_directed_arm_config(arm).pilot_activation is False
          PY
          test ! -e artifacts/phase-c-shards
          test ! -e artifacts/phase-c-pilot
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy strict
        run: uv run mypy src
      - name: Full test suite
        run: uv run pytest
      - name: Manifest integrity
        run: uv run python scripts/check_manifest.py
      - name: Frozen identity lock
        run: uv run python scripts/check_identity_lock.py
      - name: Clean engine boundary
        run: uv run python scripts/check_clean_engine_boundary.py
      - name: Phase A authority
        run: uv run python scripts/check_phase_a_authority.py
      - name: Phase A certification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/check_phase_a_certification.py
      - name: Phase A golden transcripts
        run: uv run python scripts/check_phase_a_golden_transcripts.py
      - name: Phase B evaluator
        run: uv run python scripts/check_phase_b_evaluator.py
      - name: Phase B authority
        run: uv run python scripts/check_phase_b_authority.py
      - name: Phase B certification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/check_phase_b_certification.py
      - name: Full deck coverage
        run: uv run python scripts/check_full_deck_coverage.py
      - name: Existing Phase C controls and 700-seed regression contract
        run: |
          uv run pytest \
            tests/phase_c/test_phase_c_control.py \
            tests/phase_c/test_phase_c_700_regressions.py \
            tests/phase_c/test_phase_c_workflow_contract.py
      - name: Exploratory V2 gates
        run: uv run pytest tests/phase_c/test_exploratory_v2_*.py

  arm-diagnostics:
    needs: integrity-and-standard-regression
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        arm_id:
          - EXPLORATORY_AGGRESSIVE_V2
          - EXPLORATORY_ALT_PACKAGE_NO_GLINT_TUTOR_V2
          - EXPLORATORY_INTERACTION_DISCOVERY_V2
    env:
      IDENTITY_MODEL_SHA256: ${{ vars.IDENTITY_MODEL_V2_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.implementation_commit }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Reject pilot artifacts before arm execution
        run: |
          test ! -e artifacts/phase-c-shards
          test ! -e artifacts/phase-c-pilot
      - name: Execute production-equivalent V2 arm diagnostic
        env:
          ARM_ID: ${{ matrix.arm_id }}
        run: |
          uv run python -m mtg_runs.phase_c_exploratory_v2_diagnostic \
            --arm-id "${ARM_ID}" \
            --output-root artifacts/phase-c-exploratory-v2-diagnostic
      - name: Validate arm evidence gates
        env:
          ARM_ID: ${{ matrix.arm_id }}
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          arm = os.environ["ARM_ID"]
          root = Path("artifacts/phase-c-exploratory-v2-diagnostic") / arm.lower()
          summary = json.loads(
              (root / "NON_AUTHORIZED_DIAGNOSTIC-summary.json").read_text()
          )
          assert summary["artifact_classification"] == "NON_AUTHORIZED_DIAGNOSTIC"
          assert summary["authorized_execution"] is False
          assert summary["pilot_measurement_artifacts_created"] == 0
          assert summary["fresh_transcript_replay_fail"] == 0
          assert summary["fresh_policy_recompute_fail"] == 0
          assert summary["baseline_candidate_retained"] == summary["baseline_candidate_required"]
          assert summary["candidate_score_vectors_persisted"] == summary["candidate_score_vectors_required"]
          assert summary["land_guardrail_compliant"] == summary["land_guardrail_applicable"]
          PY
      - name: Prove no official pilot artifacts were created
        if: always()
        run: |
          test ! -e artifacts/phase-c-shards
          test ! -e artifacts/phase-c-pilot
          test -d artifacts/phase-c-exploratory-v2-diagnostic
          if find artifacts/phase-c-exploratory-v2-diagnostic -type f \
              \( -iname '*pilot*' -o -iname '*authorization*' -o -iname '*full-study*' \) \
              -print -quit | grep -q .; then
            echo "V2 diagnostic emitted a forbidden pilot/full-study artifact" >&2
            exit 1
          fi
      - name: Upload arm-separated diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NON_AUTHORIZED_DIAGNOSTIC-${{ matrix.arm_id }}-${{ inputs.implementation_commit }}
          path: artifacts/phase-c-exploratory-v2-diagnostic/${{ matrix.arm_id }}/
          if-no-files-found: error
          retention-days: 30
