name: Apply resolution entry hardening

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Replace caller-supplied resolution authorization with private entry point
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path("src/mtg_kernel/engine.py")
          text = engine.read_text(encoding="utf-8")
          call = "self.resolve_top(_record=False, _all_players_passed=True)"
          if text.count(call) != 1:
              raise SystemExit("priority resolution call shape changed; refusing to edit")
          text = text.replace(call, "self._resolve_top_after_all_players_pass()", 1)

          start_marker = "    def resolve_top(\n"
          body_marker = (
              "        self._ensure_active()\n"
              "        before = self._begin_atomic()\n"
              "        try:\n"
          )
          start = text.find(start_marker)
          body = text.find(body_marker, start)
          if start < 0 or body < 0:
              raise SystemExit("resolve_top anchors changed; refusing to edit")
          header = text[start:body]
          required_header_parts = (
              "_record: bool = True",
              "_all_players_passed: bool = False",
          )
          if not all(part in header for part in required_header_parts):
              raise SystemExit("resolve_top signature changed; refusing to edit")

          public_method = (
              "    def resolve_top(\n"
              "        self,\n"
              "        *,\n"
              "        _record: bool = True,\n"
              "        _all_players_passed: bool = False,\n"
              "    ) -> None:\n"
              "        \"\"\"Reject direct resolution; only pass_priority may enter the resolver.\"\"\"\n"
              "        del _record, _all_players_passed\n"
              "        self._ensure_active()\n"
              "        raise IllegalAction(\"the stack resolves only after all players pass priority\")\n\n"
          )
          private_header = "    def _resolve_top_after_all_players_pass(self) -> None:\n"
          remainder = text[body:]
          authorization_check = (
              "            if not _all_players_passed:\n"
              "                raise IllegalAction(\n"
              "                    \"the stack resolves only after all players pass priority\"\n"
              "                )\n"
          )
          if remainder.count(authorization_check) != 1:
              raise SystemExit("resolution authorization block changed; refusing to edit")
          remainder = remainder.replace(authorization_check, "", 1)
          record_block = (
              "            if _record:\n"
              "                self._record_command(\"resolve_top\")\n"
          )
          if remainder.count(record_block) != 1:
              raise SystemExit("resolution record block changed; refusing to edit")
          remainder = remainder.replace(record_block, "", 1)
          engine.write_text(
              text[:start] + public_method + private_header + remainder,
              encoding="utf-8",
          )

          tests = Path("tests/phase_a/test_kernel_acceptance.py")
          text = tests.read_text(encoding="utf-8")
          anchor = (
              "    with pytest.raises(IllegalAction, match=\"only after all players pass\"):\n"
              "        executor.resolve_top()\n"
              "    assert state_hash(state) == before\n"
              "    assert state.stack[-1] == spell.object_id\n\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit("resolution regression anchor changed; refusing to edit")
          addition = anchor + (
              "    with pytest.raises(IllegalAction, match=\"only after all players pass\"):\n"
              "        executor.resolve_top(_all_players_passed=True)\n"
              "    assert state_hash(state) == before\n"
              "    assert state.stack[-1] == spell.object_id\n\n"
          )
          tests.write_text(text.replace(anchor, addition, 1), encoding="utf-8")
          PY
      - name: Validate hardening
        run: |
          uv sync --frozen --all-extras
          uv run ruff format src/mtg_kernel/engine.py tests/phase_a/test_kernel_acceptance.py
          uv run ruff check src/mtg_kernel/engine.py tests/phase_a/test_kernel_acceptance.py
          uv run pytest -q tests/phase_a
      - name: Commit ordinary source changes and remove helper
        run: |
          rm .github/workflows/apply-resolution-entry-hardening.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Harden stack resolution entry point"
          git push origin HEAD:agent/phase-a-post-merge-corrections
