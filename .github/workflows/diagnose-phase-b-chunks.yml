name: Diagnose Phase B patch chunks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'engine/phase-b-full-deck-policy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Report chunk checksums
        run: |
          for file in .phase-b-patch-*; do
            printf '%s ' "${file}"
            wc -c < "${file}" | tr -d '\n'
            printf ' '
            sha256sum "${file}" | cut -d' ' -f1
          done
          cat .phase-b-patch-* > /tmp/staged.b64
          printf 'combined '
          wc -c < /tmp/staged.b64 | tr -d '\n'
          printf ' '
          sha256sum /tmp/staged.b64 | cut -d' ' -f1
          base64 --decode /tmp/staged.b64 > /tmp/staged.gz
          gzip -t /tmp/staged.gz
