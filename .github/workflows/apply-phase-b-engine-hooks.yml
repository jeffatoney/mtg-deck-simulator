name: Apply Phase B Engine Hooks

on:
  push:
    branches:
      - engine/phase-b-full-deck-policy
    paths:
      - .github/workflows/apply-phase-b-engine-hooks.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply exact reviewed patch
        run: |
          git apply --check automation/phase-b-engine-hooks.patch
          git apply automation/phase-b-engine-hooks.patch
      - name: Verify exact source result
        run: |
          python -m py_compile src/mtg_kernel/engine.py
          git diff --check
          test "$(git hash-object src/mtg_kernel/engine.py)" = "f78f8455bd623000963e63db5ba518ef2bd44279"
      - name: Commit ordinary source diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mtg_kernel/engine.py
          git commit -m "Integrate Phase B actions into the production executor"
          git push origin HEAD:${{ github.ref_name }}
