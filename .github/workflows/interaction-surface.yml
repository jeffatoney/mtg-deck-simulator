name: Interaction Surface Artifact

on:
  pull_request:
    paths:
      - "automation/interaction-*.json"
      - "docs/audit/interaction-coverage/**"
      - "scripts/build_interaction_coverage_manifest.py"
      - "src/mtg_cards/full_deck.py"
      - "src/mtg_cards/oracle.py"
      - "src/mtg_deck/**"
      - "docs/source/oracle/snapshot_v1.json"
      - "docs/source/decklist.txt"
      - "docs/source/commanders.txt"
      - "docs/source/MagicCompRules_2026-06-19.txt"
      - "tests/interaction_coverage/**"
      - ".github/workflows/interaction-*.yml"
  push:
    branches: [main]
    paths:
      - "automation/interaction-*.json"
      - "docs/audit/interaction-coverage/**"
      - "scripts/build_interaction_coverage_manifest.py"
      - "src/mtg_cards/full_deck.py"
      - "src/mtg_cards/oracle.py"
      - "src/mtg_deck/**"
      - "docs/source/oracle/snapshot_v1.json"
      - "docs/source/decklist.txt"
      - "docs/source/commanders.txt"
      - "docs/source/MagicCompRules_2026-06-19.txt"
      - "tests/interaction_coverage/**"
      - ".github/workflows/interaction-*.yml"

permissions:
  contents: read

jobs:
  surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Build interaction surface
        run: python scripts/build_interaction_coverage_manifest.py --output interaction-surface.json
      - name: Publish interaction surface
        uses: actions/upload-artifact@v4
        with:
          name: interaction-surface-${{ github.sha }}
          path: interaction-surface.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify frozen surface lock
        run: python scripts/build_interaction_coverage_manifest.py --check-lock
