name: Interaction Surface Artifact

on:
  pull_request:
    paths:
      - "automation/agent-a-*.json"
      - "automation/agent-a-deck-interaction-manifest/**"
      - "automation/interaction-*.json"
      - "docs/audit/interaction-coverage/**"
      - "scripts/build_interaction_coverage_manifest.py"
      - "scripts/check_interaction_candidate_lock.py"
      - "scripts/audit_policy_choice_replay_conformance.py"
      - "src/mtg_cards/full_deck.py"
      - "src/mtg_cards/oracle.py"
      - "src/mtg_deck/**"
      - "docs/source/oracle/snapshot_v1.json"
      - "docs/source/decklist.txt"
      - "docs/source/commanders.txt"
      - "docs/source/MagicCompRules_2026-06-19.txt"
      - "tests/interaction_coverage/**"
      - ".github/workflows/interaction-*.yml"
  push:
    branches: [main]
    paths:
      - "automation/agent-a-*.json"
      - "automation/agent-a-deck-interaction-manifest/**"
      - "automation/interaction-*.json"
      - "docs/audit/interaction-coverage/**"
      - "scripts/build_interaction_coverage_manifest.py"
      - "scripts/check_interaction_candidate_lock.py"
      - "scripts/audit_policy_choice_replay_conformance.py"
      - "src/mtg_cards/full_deck.py"
      - "src/mtg_cards/oracle.py"
      - "src/mtg_deck/**"
      - "docs/source/oracle/snapshot_v1.json"
      - "docs/source/decklist.txt"
      - "docs/source/commanders.txt"
      - "docs/source/MagicCompRules_2026-06-19.txt"
      - "tests/interaction_coverage/**"
      - ".github/workflows/interaction-*.yml"

permissions:
  contents: read

jobs:
  surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Build candidate interaction surface
        run: python scripts/build_interaction_coverage_manifest.py --output interaction-surface.json
      - name: Publish candidate surface and proof provenance
        uses: actions/upload-artifact@v4
        with:
          name: interaction-surface-${{ github.sha }}
          path: |
            interaction-surface.json
            automation/interaction-coverage-lock.json
            automation/agent-a-findings-adjudication.json
            automation/agent-a-deck-interaction-manifest
            scripts/build_interaction_coverage_manifest.py
            scripts/check_interaction_candidate_lock.py
            scripts/audit_policy_choice_replay_conformance.py
          if-no-files-found: error
          retention-days: 14
      - name: Publish short-lived integration source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: integration-source-${{ github.sha }}
          path: |
            .github
            .python-version
            automation
            docs
            pyproject.toml
            scripts
            src
            tests
            uv.lock
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Verify provisional or reviewed interaction lock
        run: python scripts/check_interaction_candidate_lock.py
