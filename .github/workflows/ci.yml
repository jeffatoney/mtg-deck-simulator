name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Format files
        run: |
          uv run ruff format \
            src/mtg_sim/__init__.py \
            src/mtg_sim/phase5d_cards.py \
            src/mtg_sim/cli.py \
            src/mtg_sim/phase5a_cards.py \
            tests/test_phase5d_commanders_combos.py
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: phase5d-formatted-files
          path: |
            src/mtg_sim/__init__.py
            src/mtg_sim/phase5d_cards.py
            src/mtg_sim/cli.py
            src/mtg_sim/phase5a_cards.py
            tests/test_phase5d_commanders_combos.py
          if-no-files-found: error
