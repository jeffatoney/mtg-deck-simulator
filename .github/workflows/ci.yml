name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Repository-controlled external anchor shared by the lock check and its tests.
      IDENTITY_MODEL_SHA256: ${{ vars.IDENTITY_MODEL_V2_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Certify the exact PR head commit rather than GitHub's temporary merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Frozen identity lock integrity
        run: uv run python scripts/check_identity_lock.py
      - name: Phase A authority classification
        run: uv run python scripts/check_phase_a_authority.py
      - name: Phase B evaluator and learning boundary
        run: uv run python scripts/check_phase_b_evaluator.py
      - name: Clean engine and support-package boundary
        run: uv run python scripts/check_clean_engine_boundary.py
      - name: Legacy package is not importable
        run: |
          if uv run python -c "import mtg_sim" 2>/dev/null; then
            echo "FAIL: mtg_sim is importable from the installed environment" >&2
            exit 1
          fi
          echo "PASS: mtg_sim is not importable"
      - name: Format
        id: format
        continue-on-error: true
        run: uv run ruff format --check --diff .
      - name: Prepare formatted-source suggestion
        if: steps.format.outcome == 'failure'
        run: |
          uv run ruff format .
          mkdir -p "${RUNNER_TEMP}/ruff-formatted"
          git diff --name-only -z -- '*.py' | xargs -0 -r cp --parents -t "${RUNNER_TEMP}/ruff-formatted"
      - name: Upload formatted-source suggestion
        if: steps.format.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ruff-formatted-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ruff-formatted
          if-no-files-found: error
          retention-days: 7
      - name: Enforce formatting
        if: steps.format.outcome == 'failure'
        run: exit 1
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Phase C exact-deck Turn-10 production policy and replay smoke
        run: uv run python scripts/check_phase_c_turn10.py

      # Phase A is a standing regression contract. Every later branch and every push to
      # main must continue to pass it; it is not restricted to the original Phase A branch.
      - name: Phase A production verifier
        env:
          PHASE_A_ARTIFACT_ROOT: ${{ runner.temp }}/phase-a-result
        run: uv run mtg-engine verify-phase-a
      - name: Build CI certification candidate
        run: |
          RESULT="$(uv run python -m mtg_verify.result_selection \
            --phase phase-a \
            --root "${RUNNER_TEMP}/phase-a-result")"
          uv run python scripts/record_phase_a_certification.py \
            --verifier-result "${RESULT}" \
            --output "${RUNNER_TEMP}/phase-a-certification-candidate/CERTIFICATION.json"
      - name: Validate Phase A certification candidate
        env:
          PHASE_A_CERTIFICATION_RECORD: ${{ runner.temp }}/phase-a-certification-candidate/CERTIFICATION.json
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/check_phase_a_certification.py

      # Certification-negative tests need to validate the newly generated candidate when
      # covered content changed. The committed record still must pass the separate durable
      # gate below before the pull request can merge.
      - name: Tests
        env:
          PHASE_A_CERTIFICATION_RECORD: ${{ runner.temp }}/phase-a-certification-candidate/CERTIFICATION.json
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run pytest -q
      - name: Manifest integrity
        run: uv run python scripts/check_manifest.py
      # Phase B is a blocking gate. The exact deck, strategic model, owner-approved
      # transcripts, and durable certification must all pass on the exact checked-out head.
      - name: Phase B verifier
        id: phase_b
        env:
          PHASE_A_CERTIFICATION_RECORD: ${{ runner.temp }}/phase-a-certification-candidate/CERTIFICATION.json
          PHASE_B_ARTIFACT_ROOT: ${{ runner.temp }}/phase-b-result
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run mtg-engine verify-phase-b
      - name: Build Phase B certification candidate
        run: |
          RESULT="$(uv run python -m mtg_verify.result_selection \
            --phase phase-b \
            --root "${RUNNER_TEMP}/phase-b-result")"
          uv run python scripts/record_phase_b_certification.py \
            --verifier-result "${RESULT}" \
            --output "${RUNNER_TEMP}/phase-b-certification-candidate/CERTIFICATION.json"
      - name: Validate Phase B certification candidate
        env:
          PHASE_B_CERTIFICATION_RECORD: ${{ runner.temp }}/phase-b-certification-candidate/CERTIFICATION.json
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/check_phase_b_certification.py
      - name: Phase C no-game dry run
        run: uv run mtg-engine phase-c-dry-run
      # These two tracked-record gates intentionally run only after both exact-head
      # candidates exist. A covered technical change can therefore produce legitimate
      # renewal artifacts in one CI run while still keeping the PR red until those
      # unmodified CI-produced candidates are committed.
      - name: Durable Phase A certification is current
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/check_phase_a_certification.py
      - name: Durable Phase B certification is current
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/check_phase_b_certification.py
      - name: Upload Phase B verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-b-result-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/phase-b-result
          if-no-files-found: error
          retention-days: 90
      - name: Upload Phase B certification candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-b-certification-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/phase-b-certification-candidate
          if-no-files-found: error
          retention-days: 30

      - name: Upload Phase A verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-a-result-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/phase-a-result
          if-no-files-found: error
          retention-days: 90
      - name: Upload Phase A certification candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-a-certification-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/phase-a-certification-candidate
          if-no-files-found: error
          retention-days: 30
