name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Tests
        run: uv run pytest -q
      - name: Protected Reference Collection
        run: uv run python scripts/validate_phase_a_reference_suite.py
      - name: Control Plane Bootstrap Self-Test
        run: uv run pytest -q tests/test_control_plane.py::test_control_plane_bootstrap_positive_path
      - name: Manifest integrity
        run: uv run python scripts/check_manifest.py
      - name: Production Pilot Lock
        run: uv run python scripts/check_production_pilot_lock.py
