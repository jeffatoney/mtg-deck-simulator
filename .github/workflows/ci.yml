name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Repository-controlled external anchor shared by the lock check and its tests.
      IDENTITY_MODEL_SHA256: ${{ vars.IDENTITY_MODEL_V2_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Certify the exact PR head commit rather than GitHub's temporary merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: uv sync --frozen --all-extras

      # Stage 1 diagnostic harness. These steps collect bounded evidence before the
      # intentionally failing broker regression reaches the normal full-suite gate.
      # This temporary harness is removed from the final diagnostic evidence commit.
      - name: Stage 1 independently scan committed raw evidence
        run: |
          uv run python - <<'PY'
          from __future__ import annotations

          import collections
          import json
          import zipfile
          from pathlib import Path

          archive_path = Path(
              "docs/audit/phase-c-postpilot/evidence/pr100-corrected-behavior-971f5567.zip"
          )

          def action_lists(value, path=()):
              if isinstance(value, dict):
                  for key, child in value.items():
                      yield from action_lists(child, path + (str(key),))
                  return
              if isinstance(value, list):
                  if value and all(isinstance(item, dict) for item in value):
                      if any("action_kind" in item for item in value):
                          yield path, value
                  for index, child in enumerate(value):
                      yield from action_lists(child, path + (str(index),))

          def action_summary(action):
              return {
                  "action_kind": action.get("action_kind"),
                  "public_identity": action.get("public_identity"),
                  "canonical_public_metadata": action.get("canonical_public_metadata", {}),
              }

          with zipfile.ZipFile(archive_path) as archive:
              print("ARCHIVE_MEMBERS", json.dumps(sorted(archive.namelist())))
              grand_total = 0
              for name in sorted(archive.namelist()):
                  raw = json.loads(archive.read(name))
                  decisions = raw["decisions"]
                  grand_total += len(decisions)
                  paths = collections.Counter()
                  glint_by_path = collections.Counter()
                  glint_activate_by_path = collections.Counter()
                  selected_casts = 0
                  attacking_turns = set()
                  turn6_sequence = []
                  for decision in decisions:
                      selected = decision.get("actual_selected_public_action", {})
                      if (
                          selected.get("action_kind") == "CAST"
                          and selected.get("public_identity") == "Glint-Horn Buccaneer"
                      ):
                          selected_casts += 1
                      metadata = selected.get("canonical_public_metadata", {})
                      if (
                          selected.get("action_kind") == "DECLARE_ATTACKERS"
                          and "Glint-Horn Buccaneer" in metadata.get("attacker_identities", [])
                      ):
                          attacking_turns.add(int(decision["turn_number"]))
                      for path, actions in action_lists(decision):
                          path_text = ".".join(path)
                          paths[path_text] += 1
                          for action in actions:
                              if action.get("public_identity") == "Glint-Horn Buccaneer":
                                  glint_by_path[path_text] += 1
                                  if action.get("action_kind") == "ACTIVATE":
                                      glint_activate_by_path[path_text] += 1
                      if (
                          name == "legacy-391730338978874520.json"
                          and 63 <= int(decision.get("decision_index", -1)) <= 71
                      ):
                          turn6_sequence.append(
                              {
                                  "decision_index": int(decision["decision_index"]),
                                  "turn_number": int(decision["turn_number"]),
                                  "phase": decision.get("phase"),
                                  "step": decision.get("step"),
                                  "selected": action_summary(selected),
                              }
                          )
                  print(
                      "MEMBER_SCAN",
                      json.dumps(
                          {
                              "name": name,
                              "commit": raw["commit"],
                              "tree": raw["tree"],
                              "decisions": len(decisions),
                              "selected_glint_horn_casts": selected_casts,
                              "glint_horn_attacking_turns": sorted(attacking_turns),
                              "candidate_list_occurrences": dict(sorted(paths.items())),
                              "glint_horn_candidates_by_path": dict(sorted(glint_by_path.items())),
                              "glint_horn_activate_candidates_by_path": dict(
                                  sorted(glint_activate_by_path.items())
                              ),
                              "turn6_decisions_63_through_71": turn6_sequence,
                          },
                          sort_keys=True,
                      ),
                  )
              print("TOTAL_DECISIONS", grand_total)
          PY
      - name: Stage 1 direct executor positive
        run: >-
          uv run pytest -q
          tests/phase_b/test_glint_horn_action_surface.py::test_direct_executor_accepts_legal_glint_horn_loot_activation
          -vv
      - name: Stage 1 broker positive expected regression
        id: stage1_broker_positive
        continue-on-error: true
        run: >-
          uv run pytest -q
          tests/phase_b/test_glint_horn_action_surface.py::test_broker_exposes_and_executes_legal_glint_horn_loot_activation
          -vv
      - name: Stage 1 negative controls
        run: |
          uv run pytest -q tests/phase_b/test_glint_horn_action_surface.py -k 'omits or isolated_negative' -vv
      - name: Stage 1 exact action-surface command
        id: stage1_action_surface
        continue-on-error: true
        run: uv run pytest -q tests/phase_b/test_glint_horn_action_surface.py -vv
      - name: Stage 1 focused existing Glint-Horn transcript
        run: uv run pytest -q tests/phase_b/transcripts/test_pb_t06_glint_curiosity.py
      - name: Stage 1 exact Ruff format check
        run: uv run ruff format --check --diff .
      - name: Stage 1 exact Ruff lint check
        run: uv run ruff check .
      - name: Stage 1 exact repository evidence check
        run: uv run python scripts/check_repository_evidence.py
      - name: Stage 1 exact repository evidence gate test
        run: uv run pytest -q tests/test_repository_evidence_gate.py
      - name: Stage 1 exact policy information-boundary test
        run: uv run pytest -q tests/phase_b/test_policy_information_boundary.py
      - name: Stage 1 exact policy information-boundary check
        run: uv run python scripts/check_policy_information_boundary.py
      - name: Stage 1 require expected broker-only regression
        run: |
          test "${{ steps.stage1_broker_positive.outcome }}" = "failure"
          test "${{ steps.stage1_action_surface.outcome }}" = "failure"

      - name: Frozen identity lock integrity
        run: uv run python scripts/check_identity_lock.py
      - name: Repository evidence integrity
        run: uv run python scripts/check_repository_evidence.py
      - name: Phase A authority classification
        run: uv run python scripts/check_phase_a_authority.py
      - name: Phase B evaluator and learning boundary
        run: uv run python scripts/check_phase_b_evaluator.py
      - name: Public policy information boundary
        run: uv run python scripts/check_policy_information_boundary.py
      - name: Public policy noninterference regression
        run: uv run pytest -q tests/phase_b/test_policy_information_boundary.py
      - name: Clean engine and support-package boundary
        run: uv run python scripts/check_clean_engine_boundary.py
      - name: Legacy package is not importable
        run: |
          if uv run python -c "import mtg_sim" 2>/dev/null; then
            echo "FAIL: mtg_sim is importable from the installed environment" >&2
            exit 1
          fi
          echo "PASS: mtg_sim is not importable"
      - name: Format
        id: format
        continue-on-error: true
        run: uv run ruff format --check --diff .
      - name: Prepare formatted-source suggestion
        if: steps.format.outcome == 'failure'
        run: |
          uv run ruff format .
          mkdir -p "${RUNNER_TEMP}/ruff-formatted"
          git diff --name-only -z -- '*.py' | xargs -0 -r cp --parents -t "${RUNNER_TEMP}/ruff-formatted"
      - name: Upload formatted-source suggestion
        if: steps.format.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ruff-formatted-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ruff-formatted
          if-no-files-found: error
          retention-days: 7
      - name: Enforce formatting
        if: steps.format.outcome == 'failure'
        run: exit 1
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Phase C exact-deck Turn-10 production policy and replay smoke
        run: uv run python scripts/check_phase_c_turn10.py

      # Phase A is a standing regression contract. Every later branch and every push to
      # main must continue to pass it; it is not restricted to the original Phase A branch.
      - name: Phase A production verifier
        env:
          PHASE_A_ARTIFACT_ROOT: ${{ runner.temp }}/phase-a-result
        run: uv run mtg-engine verify-phase-a
      - name: Build CI certification candidate
        run: |
          RESULT="$(uv run python -m mtg_verify.result_selection \
            --phase phase-a \
            --root "${RUNNER_TEMP}/phase-a-result")"
          uv run python scripts/record_phase_a_certification.py \
            --verifier-result "${RESULT}" \
            --output "${RUNNER_TEMP}/phase-a-certification-candidate/CERTIFICATION.json"
      - name: Validate Phase A certification candidate
        env:
          PHASE_A_CERTIFICATION_RECORD: ${{ runner.temp }}/phase-a-certification-candidate/CERTIFICATION.json
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/check_phase_a_certification.py

      # Certification-negative tests need to validate the newly generated candidate when
      # covered content changed. The committed record still must pass the separate durable
      # gate below before the pull request can merge.
      - name: Tests
        id: tests
        continue-on-error: true
        env:
          PHASE_A_CERTIFICATION_RECORD: ${{ runner.temp }}/phase-a-certification-candidate/CERTIFICATION.json
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          uv run pytest -q --tb=short 2>&1 | tee "${RUNNER_TEMP}/pytest.log"
      - name: Upload pytest failure evidence
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failure-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/pytest.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce tests
        if: steps.tests.outcome == 'failure'
        run: exit 1
      - name: Manifest integrity
        run: uv run python scripts/check_manifest.py
      # Phase B is a blocking gate. The exact deck, strategic model, owner-approved
      # transcripts, and durable certification must all pass on the exact checked-out head.
      - name: Phase B verifier
        id: phase_b
        env:
          PHASE_A_CERTIFICATION_RECORD: ${{ runner.temp }}/phase-a-certification-candidate/CERTIFICATION.json
          PHASE_B_ARTIFACT_ROOT: ${{ runner.temp }}/phase-b-result
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run mtg-engine verify-phase-b
      - name: Build Phase B certification candidate
        run: |
          RESULT="$(uv run python -m mtg_verify.result_selection \
            --phase phase-b \
            --root "${RUNNER_TEMP}/phase-b-result")"
          uv run python scripts/record_phase_b_certification.py \
            --verifier-result "${RESULT}" \
            --output "${RUNNER_TEMP}/phase-b-certification-candidate/CERTIFICATION.json"
      - name: Validate Phase B certification candidate
        env:
          PHASE_B_CERTIFICATION_RECORD: ${{ runner.temp }}/phase-b-certification-candidate/CERTIFICATION.json
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/check_phase_b_certification.py
      - name: Phase C no-game dry run
        run: uv run mtg-engine phase-c-dry-run
      # These two tracked-record gates intentionally run only after both exact-head
      # candidates exist. A covered technical change can therefore produce legitimate
      # renewal artifacts in one CI run while still keeping the PR red until those
      # unmodified CI-produced candidates are committed.
      - name: Durable Phase A certification is current
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/check_phase_a_certification.py
      - name: Durable Phase B certification is current
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/check_phase_b_certification.py
      - name: Upload Phase B verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-b-result-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/phase-b-result
          if-no-files-found: error
          retention-days: 90
      - name: Upload Phase B certification candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-b-certification-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/phase-b-certification-candidate
          if-no-files-found: error
          retention-days: 30

      - name: Upload Phase A verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-a-result-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/phase-a-result
          if-no-files-found: error
          retention-days: 90
      - name: Upload Phase A certification candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-a-certification-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/phase-a-certification-candidate
          if-no-files-found: error
          retention-days: 30
