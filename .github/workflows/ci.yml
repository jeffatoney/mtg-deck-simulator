name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Frozen identity lock integrity
        run: uv run python scripts/check_identity_lock.py
      - name: Phase A authority classification
        run: uv run python scripts/check_phase_a_authority.py
      - name: Clean engine legacy boundary
        run: uv run python scripts/check_clean_engine_boundary.py
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Tests
        run: uv run pytest -q
      - name: Manifest integrity
        run: uv run python scripts/check_manifest.py
