name: Format Phase 5D

on:
  push:
    branches:
      - codex/implement-phase-5d-commanders-and-combos

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/implement-phase-5d-commanders-and-combos
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Format Phase 5D files
        run: |
          uv run ruff format \
            src/mtg_sim/__init__.py \
            src/mtg_sim/phase5d_cards.py \
            src/mtg_sim/cli.py \
            src/mtg_sim/phase5a_cards.py \
            tests/test_phase5d_commanders_combos.py
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mtg_sim/__init__.py src/mtg_sim/phase5d_cards.py src/mtg_sim/cli.py src/mtg_sim/phase5a_cards.py tests/test_phase5d_commanders_combos.py
          git commit -m "Apply Ruff formatting to Phase 5D"
          git push origin HEAD:codex/implement-phase-5d-commanders-and-combos
