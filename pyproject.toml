[project]
name = "malcolm-breeches-sim"
version = "0.1.0"
description = "Rules-validated Malcolm and Breeches Commander simulator"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=16",
  "pydantic>=2.8",
  "typer>=0.12",
  "orjson>=3.10",
  "zstandard>=0.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5",
  "hypothesis>=6.110",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
# The former `mtg-sim` entry point is deliberately gone. It exposed the legacy
# rules engine, the coverage counters, and the 500/200 pilot -- all classified
# PROHIBITED_AS_PHASE_A_EVIDENCE. Source validation survives on its own command.
mtg-sources = "mtg_sources.cli:app"
mtg-engine = "mtg_kernel.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `legacy/mtg_sim` is intentionally absent. The legacy engine remains in the tree as
# readable evidence but is NOT an installed package, so it is not importable from any
# environment built from this project. This is the primary clean-engine boundary:
# every dynamic-import bypass of a static scanner still fails with ModuleNotFoundError.
# Verification support is installed separately so subprocess-based CI tooling is not
# part of either clean production package.
packages = ["src/mtg_sources", "src/mtg_kernel", "src/mtg_cards", "src/mtg_verify"]

[tool.pytest.ini_options]
# `legacy/tests` is intentionally outside testpaths. Those tests exercise the legacy
# engine and are classified ARCHIVAL_REFERENCE_ONLY by the Phase A authority map; a
# merge gate must not depend on archival material.
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
