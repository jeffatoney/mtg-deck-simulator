[project]
name = "malcolm-breeches-sim"
version = "0.1.0"
description = "Rules-validated Malcolm and Breeches Commander simulator"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=16",
  "pydantic>=2.8",
  "typer>=0.12",
  "orjson>=3.10",
  "zstandard>=0.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5",
  "hypothesis>=6.110",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
mtg-sim = "mtg_sim.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtg_sim", "src/mtg_kernel", "src/mtg_cards"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
